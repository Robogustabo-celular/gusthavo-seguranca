<meta name="robots" content="noindex">
<title>Gestão de Mudança Remineralizador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#14222E;--muted:#586876;--line:#D7DFE5;
  --navy:#0D385B;--orange:#F78300;--sky:#529ED0;--hi:#F2B705;
  --bad:#C62F28;--warn:#B8740A;--good:#2E8B57;--info:#1F6FB2;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#0B141C;--surface:#132130;--surface2:#1A2B3C;--ink:#E3EAF0;--muted:#A3B2BE;--line:#26394B;--bad:#EA6A62;--warn:#E3A33A;--good:#4FB77D;--info:#5AA2E0;--sky:#7DB8E3}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B141C;--surface:#132130;--surface2:#1A2B3C;--ink:#E3EAF0;--muted:#A3B2BE;--line:#26394B;--bad:#EA6A62;--warn:#E3A33A;--good:#4FB77D;--info:#5AA2E0;--sky:#7DB8E3}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3,h4{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.12;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}

/* cabeçalho */
.hero{position:relative;background:#0D385B;color:#fff;overflow:hidden}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.45;pointer-events:none}
.hero .wrap{position:relative;padding-block:16px 0}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .lg{height:38px;width:auto}
.brand .sl{height:26px;width:auto;opacity:.9;padding-left:14px;border-left:1px solid rgba(255,255,255,.28)}
.save{margin-left:auto;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);padding:5px 11px;border-radius:999px;display:flex;gap:7px;align-items:center}
.save i{width:8px;height:8px;border-radius:50%;background:#4ADE80}
.save.pend i{background:var(--hi)}
.save.err i{background:#FF7A70}
.doc{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:20px}
.hero .voltar{display:inline-block;margin-top:10px;color:#fff;opacity:.85;font-size:13px;font-weight:600;text-decoration:none}
.hero .voltar:hover{opacity:1;text-decoration:underline}
.hero h1{font-size:clamp(28px,5.5vw,46px);font-weight:700;margin-top:2px}
.prop{max-width:80ch;color:rgba(255,255,255,.86);margin:8px 0 0;font-size:15px}
.tabs{display:flex;gap:4px;margin-top:18px}
.tabs button{border:0;background:none;color:rgba(255,255,255,.72);font-weight:600;font-size:15px;padding:11px 16px 13px;border-radius:10px 10px 0 0}
.tabs button[aria-current="page"]{background:var(--bg);color:var(--ink)}

main{padding-block:20px 90px}

/* painel */
.big{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px}
@media (max-width:900px){.big{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.big{grid-template-columns:1fr}}
.bc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;align-content:start;position:relative;overflow:hidden}
.bc .l{font-size:13px;color:var(--muted);font-weight:600}
.bc .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.bc .s{font-size:13px;color:var(--muted)}
.bc.alert{border-color:var(--bad)}
.bc.alert::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(135deg,#14222E 0 7px,var(--hi) 7px 14px)}
.bc.alert .v{color:var(--bad)}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);padding:12px 14px;text-align:left;border:0}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.kpi span{font-size:13px;color:var(--muted)}
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:16px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel h2{font-size:21px;margin-bottom:12px;display:flex;align-items:baseline;gap:8px}
.panel h2 small{font-family:"Barlow",sans-serif;font-weight:500;font-size:13px;color:var(--muted)}
.falta{display:grid;gap:8px}
.fi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface2);text-align:left;border:0;width:100%}
.fi .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;margin-top:2px;white-space:nowrap}
.fi .tag.alta{background:var(--bad)}
.fi .tag.media{background:var(--warn)}
.fi .tag.info{background:var(--info)}
.fi b{display:block;font-weight:600;line-height:1.3}
.fi small{color:var(--muted);font-size:13px}
.fi .go{font-size:13px;color:var(--info);font-weight:600;white-space:nowrap}
.pz{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.pz:last-child{border-bottom:0}
.pzd{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.pzd small{display:block;font-family:"Barlow",sans-serif;font-size:11px;font-weight:600;margin-top:3px}
.secs{display:grid;gap:10px}
.sr{display:grid;grid-template-columns:28px 1fr 44px;gap:10px;align-items:center;font-size:14px;background:none;border:0;text-align:left;padding:0;width:100%}
.sr em{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--muted);font-size:16px}
.sr .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.rbars{display:grid;gap:10px}
.rb{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.rb .t{display:flex;height:22px;gap:2px}
.rb .t i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;border-radius:4px;min-width:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* documento */
.snav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:8px;margin-top:-8px}
.snav::-webkit-scrollbar{display:none}
.snav button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;display:flex;gap:6px;align-items:center}
.snav button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.snav button[aria-current="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sec{margin-top:16px;display:grid;gap:14px}
.sech{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sech h2{font-size:28px}
.sech .n{font-family:"Barlow Condensed",sans-serif;color:var(--orange);font-size:28px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.card h3{font-size:20px}
.card .help{margin:0;font-size:13px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.g3,.g4{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);align-content:start}
label.f.full{grid-column:1/-1}
.inp{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-height:42px;font-size:15px;font-weight:400}
.inp:focus{border-color:var(--sky)}
.inp.vazio{border-style:dashed;border-color:color-mix(in srgb,var(--warn) 60%,var(--line))}
textarea.inp{min-height:70px;resize:vertical}
.row{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.rowh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowh .id{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;min-width:34px;text-align:center;border-radius:8px;padding:2px 6px;background:var(--surface2)}
.rowh .sp{flex:1}
.rm{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--bad);font-weight:600}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.bad{background:var(--bad);color:#fff}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.pill.sug{background:color-mix(in srgb,var(--orange) 16%,transparent);color:var(--orange)}
.pill.cls-alto{background:var(--bad);color:#fff}
.pill.cls-medio{background:var(--warn);color:#fff}
.pill.cls-baixo{background:var(--good);color:#fff}
.add{border:1.5px dashed var(--line);background:none;border-radius:12px;padding:12px;font-weight:700;color:var(--info);width:100%}
.seg3{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);gap:2px}
.seg3 button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--muted)}
.seg3 button[aria-pressed="true"][data-v="Sim"]{background:var(--navy);color:#fff}
.seg3 button[aria-pressed="true"][data-v="Não"]{background:var(--muted);color:var(--surface)}
.seg3 button[aria-pressed="true"][data-v="NA"]{background:var(--surface2);color:var(--ink);outline:1px solid var(--line)}
.q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.q:last-child{border-bottom:0}
.q small{display:block;font-size:11px;font-weight:700;color:var(--orange);letter-spacing:.04em}
@media (max-width:520px){.q{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px}
.chk input{width:20px;height:20px;accent-color:var(--navy)}
.risk-mx{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.risk-mx{grid-template-columns:1fr}}
.mx{border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.mx h4{font-size:15px;color:var(--muted)}
.hc{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.hc table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.hc th,.hc td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.hc th{background:var(--surface2);font-size:12px;color:var(--muted)}
.hc input{width:70px;min-height:34px;padding:4px 6px}
.btn{border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-weight:700;font-size:15px;background:var(--surface2);color:var(--ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.acc{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn:disabled{opacity:.55}
.btn svg{width:18px;height:18px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.opt{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt input{width:20px;height:20px;accent-color:var(--navy)}
.lock{max-width:560px;margin:0 auto;padding:60px 16px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14222E;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:95;max-width:90vw;display:none}
#toast.on{display:block}
.confirm{position:fixed;inset:0;z-index:90;background:rgba(8,20,32,.6);display:grid;place-items:center;padding:16px}
.confirm .box{background:var(--surface);border-radius:16px;padding:18px;max-width:380px;width:100%;display:grid;gap:14px}
.confirm p{margin:0;font-size:16px}
</style>

<script>/* Nuvem Concremat (Firebase): banco em tempo real, fotos e login.
   Mantém a mesma interface que o app já usava (db, assets, downloads, user). */
(function(){
  const CFG = {"apiKey":"AIzaSyBr5RUesMJBhKWOepHI6QK-PkXIIMctXeU","authDomain":"seguranca-concremat.firebaseapp.com","projectId":"seguranca-concremat","storageBucket":"seguranca-concremat.firebasestorage.app","messagingSenderId":"448785550205","appId":"1:448785550205:web:3e0b78fdef40581e8b1a14"};
  const DONO = 'robogustabo@gmail.com';
  const PUBLICAS = new Set(['planos', 'planoAcoes', 'config']);
  const DICA = 'concremat.logado';

  if (!window.firebase){
    const msg = 'Não foi possível carregar o banco de dados. Abra o sistema pelo link do site (github.io) e confira a internet.';
    const falha = () => Promise.reject(Object.assign(new Error('sem-firebase'), {code:'sem-firebase'}));
    window.nuvem = { logado: () => false, pronto: Promise.resolve(null), entrar: falha, sair(){}, conferir: async () => false, foto: async () => '', importar: falha };
    window.claude = { use: async () => null };
    document.addEventListener('DOMContentLoaded', () => { const b = document.createElement('div'); b.textContent = msg; b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#8A1F11;color:#fff;font:600 14px Barlow,system-ui,sans-serif;padding:12px 14px;border-radius:12px;text-align:center'; document.body.appendChild(b); });
    return;
  }
  firebase.initializeApp(CFG);
  const fs = firebase.firestore();
  const auth = firebase.auth();

  let usuario = null, resolvido = false;
  const dica = () => { try { return localStorage.getItem(DICA) === '1'; } catch { return false; } };
  const pronto = new Promise(res => {
    auth.onAuthStateChanged(u => {
      const antes = resolvido ? !!usuario : dica();
      usuario = u; resolvido = true;
      try { u ? localStorage.setItem(DICA, '1') : localStorage.removeItem(DICA); } catch {}
      res(u);
      if (antes !== !!u && document.readyState !== 'loading' && window.render) { try { window.render(); } catch {} }
    });
  });
  const logado = () => resolvido ? !!usuario : dica();

  /* ---------- banco ---------- */
  const limpo = o => JSON.parse(JSON.stringify(o));
  const vazioCol = () => ({docs:[], empty:true, size:0});
  function docRef(c, id){
    const r = fs.collection(c).doc(id);
    return {
      id,
      onSnapshot(fn, err){
        if (!logado() && !PUBLICAS.has(c)){ setTimeout(() => fn({id, exists:false, data:() => undefined, metadata:{hasPendingWrites:false}}), 0); return () => {}; }
        return r.onSnapshot(fn, e => { console.error(c, e); err && err(e); });
      },
      get: () => r.get(),
      set: d => r.set(limpo(d)),
      update: d => r.update(limpo(d)),
      delete: () => r.delete(),
    };
  }
  const db = {
    collection(c){
      return {
        doc: id => docRef(c, id),
        onSnapshot(fn, err){
          if (!logado() && !PUBLICAS.has(c)){ setTimeout(() => fn(vazioCol()), 0); return () => {}; }
          return fs.collection(c).onSnapshot(fn, e => { console.error(c, e); err && err(e); });
        },
      };
    },
    doc(p){ const [c, id] = String(p).split('/'); return docRef(c, id); },
  };

  /* ---------- fotos (guardadas no próprio banco) ---------- */
  const LIMITE = 680000; // cada documento do Firestore aceita até 1 MB
  const paraDataURL = b => new Promise((ok, err) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = err; f.readAsDataURL(b); });
  async function reduzir(blob){
    if (blob.size <= LIMITE) return blob;
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = url; });
      let lado = 1400, q = 0.78, out = blob;
      while (out.size > LIMITE && lado >= 600){
        const s = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
        const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0, cv.width, cv.height);
        out = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
        lado = Math.round(lado * 0.82); q = Math.max(0.55, q - 0.06);
      }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  const novoId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
  const cacheFoto = new Map();
  const assets = {
    async upload(blob){
      const d = await paraDataURL(await reduzir(blob));
      const id = novoId();
      await fs.collection('fotoBin').doc(id).set({d, em: Date.now()});
      cacheFoto.set(id, d);
      return {id};
    },
    async delete(id){ try { await fs.collection('fotoBin').doc(id).delete(); } catch {} cacheFoto.delete(id); },
  };
  async function foto(id){
    if (cacheFoto.has(id)) return cacheFoto.get(id);
    const p = fs.collection('fotoBin').doc(id).get().then(s => { const d = s.exists ? s.data().d : ''; if (!d) cacheFoto.delete(id); return d; });
    cacheFoto.set(id, p);
    const d = await p; if (d) cacheFoto.set(id, d); return d;
  }

  /* ---------- arquivos ---------- */
  const downloads = {
    async save({filename, data}){
      const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/i.test(filename) ? 'application/json' : 'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return {status:'saved'};
    }
  };

  /* ---------- sessão ---------- */
  const user = { isOwner: () => logado(), canEdit: () => logado() };
  const traduz = e => { const c = (e && e.code) || ''; const x = new Error(c); x.code = /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'senha-incorreta' : /too-many/.test(c) ? 'muitas-tentativas' : /network/.test(c) ? 'sem-internet' : c || 'erro'; return x; };
  window.nuvem = {
    logado,
    pronto,
    async entrar(senha){
      try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword(DONO, senha); try { localStorage.setItem(DICA, '1'); } catch {} return true; }
      catch (e) { throw traduz(e); }
    },
    async sair(){ try { await auth.signOut(); } catch {} try { localStorage.removeItem(DICA); } catch {} location.reload(); },
    async conferir(){ await pronto; return !!usuario; },
    foto,
    async importar(pacote, progresso){
      const dados = pacote.dados || {}, fotos = pacote.fotos || {};
      const ids = Object.keys(fotos);
      for (let i = 0; i < ids.length; i += 6){
        const lote = fs.batch();
        ids.slice(i, i + 6).forEach(id => lote.set(fs.collection('fotoBin').doc(id), {d: fotos[id], em: Date.now()}));
        await lote.commit();
        progresso && progresso(`Fotos ${Math.min(i + 6, ids.length)} de ${ids.length}`);
      }
      const docs = [];
      Object.entries(dados).forEach(([c, m]) => Object.entries(m || {}).forEach(([id, d]) => docs.push([c, id, d])));
      for (let i = 0; i < docs.length; i += 100){
        const lote = fs.batch();
        docs.slice(i, i + 100).forEach(([c, id, d]) => lote.set(fs.collection(c).doc(id), limpo(d)));
        await lote.commit();
        progresso && progresso(`Registros ${Math.min(i + 100, docs.length)} de ${docs.length}`);
      }
      return {fotos: ids.length, docs: docs.length};
    },
  };

  window.claude = { use: async (n) => { await pronto; return ({db, assets, downloads, user})[n] || null; } };
})();
</script>

function confirmar(msg, ok = 'Confirmar'){
  return new Promise(res => {
    const h = $('#cfhost');
    h.innerHTML = `<div class="confirm"><div class="box"><p>${esc(msg)}</p><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-cf="0">Cancelar</button><button class="btn pri" data-cf="1">${esc(ok)}</button></div></div></div>`;
    h.onclick = e => { const b = e.target.closest('[data-cf]'); if (!b) return; h.innerHTML = ''; h.onclick = null; res(b.dataset.cf === '1'); };
    $('[data-cf="1"]', h).focus();
  });
}

function sitPrazo(prazo, feito){
  if (feito) return {k:'good', t:'Concluído'};
  if (!prazo) return {k:'info', t:'Sem prazo'};
  const d = diffD(prazo, hoje());
  if (d < 0) return {k:'bad', t:`Vencido há ${plural(-d,'dia')}`, d};
  if (d === 0) return {k:'warn', t:'Vence hoje', d};
  if (d <= 7) return {k:'warn', t:`Vence em ${plural(d,'dia')}`, d};
  return {k:'ok', t:`Em ${plural(d,'dia')}`, d};
}
const prazoVigente = g => g.ident.prazoRevisado || g.ident.prazoImpl;
function itensComPrazo(g){
  const out = [];
  g.cronograma.forEach((r, i) => out.push({grupo:'Cronograma', sec:'s7', id:r.id || String(i+1), t:r.acao, resp:r.resp, prazo:r.prazo, feito:['Concluída','Cancelada'].includes(r.status)}));
  g.riscos.forEach((r, i) => { if (!vazio(r.medida) || r.prazo) out.push({grupo:'Medida de risco', sec:'s4', id:'R' + (r.n || i+1), t:r.medida || r.situacao, resp:r.resp, prazo:r.prazo, feito:r.status === 'Implementada'}); });
  g.comunicacao.forEach((r, i) => out.push({grupo:'Comunicação', sec:'s6', id:r.id || String(i+1), t:r.oque, resp:r.emite, prazo:r.prazo, feito:r.status === 'Enviada'}));
  g.indicadores.forEach((r, i) => out.push({grupo:'Indicador', sec:'s7', id:r.id || String(i+1), t:r.indicador, resp:r.resp, prazo:r.prazo, feito:false, acompanhamento:true}));
  if (g.org.aplicavel) g.monitoramento.forEach((r, i) => out.push({grupo:'Monitoramento', sec:'s9', id:String(i+1), t:r.acao, resp:r.resp, prazo:r.fim, feito:r.status === 'Concluída'}));
  return out;
}
function pendencias(g){
  const P = [], add = (sev, sec, t, d) => P.push({sev, sec, t, d});
  const I = g.ident;
  const pv = prazoVigente(g);
  if (pv && I.status !== 'Encerrada' && diffD(pv, hoje()) < 0) add('alta', 's1', `Prazo de implementação vencido em ${fmtD(pv)}`, 'Registre um prazo revisado e a justificativa, ou encerre a mudança.');
  [['motivacao','Motivação da mudança'],['originador','Originador'],['pontoFocal','Ponto focal'],['categoria','Categoria'],['prazoImpl','Prazo de implementação'],['proposta','Proposta']].forEach(([k, l]) => { if (vazio(I[k])) add(k === 'motivacao' || k === 'prazoImpl' ? 'alta' : 'media', 's1', `${l} não preenchido`, 'Seção 1.2'); });
  if (!g.influencia.some(r => !vazio(r.tema) || !vazio(r.area))) add('media', 's1', 'Áreas de influência não informadas', 'Seção 1.3: quais áreas precisam ser consultadas pelos impactos da mudança.');
  const q2 = g.classificacao.find(q => /estrutura organizacional/i.test(q.q));
  if (q2 && q2.resp === 'Sim'){
    if (vazio(g.rh.gerente) || vazio(g.rh.hrbp)) add('alta', 's1', 'Responsáveis do RH não informados', 'Obrigatório quando a mudança altera a estrutura organizacional.');
    if (!g.org.aplicavel) add('alta', 's9', 'Seção 9 obrigatória', 'A classificação indica mudança na estrutura organizacional.');
  }
  const semResp = g.classificacao.filter(q => vazio(q.resp)).length + g.motivadores.filter(q => vazio(q.resp)).length;
  if (semResp) add('media', 's2', `${plural(semResp,'pergunta','perguntas')} da classificação sem resposta`, 'Seção 2.1 e 2.2');
  if (!g.problemas.some(x => !vazio(x.t))) add('media', 's2', 'Problemas específicos não descritos', 'Seção 2.3');
  if (!g.objetivos.some(x => !vazio(x.t))) add('media', 's2', 'Objetivos não descritos', 'Seção 2.4');
  const treina = g.classificacao.some(q => /treinamento/i.test(q.q) && q.resp === 'Sim');
  if (treina && !g.cronograma.some(r => /treina|capacita/i.test(r.acao || ''))) add('media', 's7', 'Treinamento exigido sem ação no cronograma', 'A classificação indica necessidade de treinamento ou reciclagem.');
  const norm = g.classificacao.some(q => /documentação normativa/i.test(q.q) && q.resp === 'Sim');
  if (norm && !g.cronograma.some(r => /procedimento|PRO\b|norma/i.test(r.acao || ''))) add('media', 's7', 'Documentação normativa sem ação no cronograma', 'A classificação indica alteração em NOR, PNR, PGS ou procedimento.');
  const avPend = g.equipe.filter(r => !['Avaliado','Não se aplica'].includes(r.status)).length;
  if (avPend) add('media', 's3', `${plural(avPend,'avaliador','avaliadores')} sem avaliação concluída`, 'Seção 3.1: status da avaliação');
  const altos = g.riscos.filter(r => r.antes && r.antes.c === 'Alto');
  const altoSemMed = altos.filter(r => vazio(r.medida) || r.sug).length;
  if (altoSemMed) add('alta', 's4', `${plural(altoSemMed,'risco alto','riscos altos')} sem medida de controle confirmada`, 'Seção 4.1: confirme a medida, o responsável e o prazo.');
  const medSemPrazo = g.riscos.filter(r => r.status !== 'Implementada' && (vazio(r.resp) || vazio(r.prazo))).length;
  if (medSemPrazo) add('media', 's4', `${plural(medSemPrazo,'medida de risco','medidas de risco')} sem responsável ou prazo`, 'Seção 4.1');
  const inc = inconsistencias(g);
  if (inc.length) add('info', 's4', `Classificação de risco inconsistente em ${plural(inc.length,'caso','casos')}`, 'Mesma probabilidade e severidade com classificações diferentes: ' + inc.slice(0, 3).join('; '));
  if (!g.metodologia.ferramentas.length && vazio(g.metodologia.outras)) add('alta', 's4', 'Nenhuma ferramenta de análise de risco marcada', 'Seção 4.1: metodologia de análise');
  else if (!g.metodologia.ferramentas.includes('APR') && g.riscos.some(r => /Operacional|SSMA/i.test(r.area))) add('info', 's4', 'APR não marcada como ferramenta', 'Há riscos operacionais e de SSMA. A APR costuma ser exigida para liberar a operação.');
  const apPend = g.aprovacao.filter(r => !/^Aprovado/.test(r.status || '')).length;
  if (!g.aprovacao.length) add('alta', 's5', 'Nenhum aprovador cadastrado', 'Seção 5.1');
  else if (apPend) add('media', 's5', `${plural(apPend,'aprovação pendente','aprovações pendentes')} de ${g.aprovacao.length}`, 'Seção 5.1: cobrar os aprovadores');
  const rep = g.aprovacao.filter(r => r.status === 'Reprovado').length;
  if (rep) add('alta', 's5', `${plural(rep,'aprovador reprovou','aprovadores reprovaram')} a mudança`, 'Tratar os comentários antes de seguir.');
  const comSemPrazo = g.comunicacao.filter(r => r.status !== 'Enviada' && vazio(r.prazo)).length;
  if (comSemPrazo) add('media', 's6', `${plural(comSemPrazo,'comunicação','comunicações')} sem prazo`, 'Seção 6.1');
  if (!g.cronograma.length) add('alta', 's7', 'Cronograma de implementação vazio', 'Seção 7.1');
  const crSem = g.cronograma.filter(r => !['Concluída','Cancelada'].includes(r.status) && (vazio(r.resp) || vazio(r.prazo))).length;
  if (crSem) add('media', 's7', `${plural(crSem,'ação','ações')} do cronograma sem responsável ou prazo`, 'Seção 7.1');
  const sug = g.cronograma.filter(r => r.sug).length + g.indicadores.filter(r => r.sug).length + g.comunicacao.filter(r => r.sug).length + g.riscos.filter(r => r.sug).length;
  if (sug) add('info', 's7', `${plural(sug,'item sugerido','itens sugeridos')} para revisar`, 'Itens marcados como sugestão: edite ou exclua. Ao editar, a marca some.');
  if (!g.indicadores.length) add('alta', 's7', 'Nenhum indicador de eficácia definido', 'Seção 7.2');
  else { const iS = g.indicadores.filter(r => vazio(r.meta) || vazio(r.resp) || vazio(r.prazo)).length; if (iS) add('media', 's7', `${plural(iS,'indicador','indicadores')} sem meta, responsável ou prazo`, 'Seção 7.2'); }
  const venc = itensComPrazo(g).filter(x => !x.feito && x.prazo && diffD(x.prazo, hoje()) < 0);
  if (venc.length) add('alta', venc[0].sec, `${plural(venc.length,'item vencido','itens vencidos')} sem conclusão`, venc.slice(0, 3).map(x => `${x.grupo} ${x.id}`).join(', '));
  const crFeito = g.cronograma.length && g.cronograma.every(r => ['Concluída','Cancelada'].includes(r.status));
  if ((crFeito || I.status === 'Encerrada') && !g.eficacia.length) add('media', 's8', 'Avaliação de eficácia não registrada', 'Seção 8.1');
  if ((crFeito || I.status === 'Encerrada') && !g.licoes.some(x => !vazio(x.t))) add('info', 's8', 'Lições aprendidas não registradas', 'Seção 8.1');
  const ord = {alta:0, media:1, info:2};
  return P.sort((a, b) => ord[a.sev] - ord[b.sev]);
}
function inconsistencias(g){
  const m = {}, out = [];
  g.riscos.forEach(r => ['antes','depois'].forEach(k => { const x = r[k] || {}; if (!x.p || !x.s || !x.c) return; const key = k + '|' + x.p + '|' + x.s; (m[key] = m[key] || new Set()).add(x.c); }));
  Object.entries(m).forEach(([k, v]) => { if (v.size > 1){ const [f, p, s] = k.split('|'); out.push(`${f === 'antes' ? 'antes' : 'depois'} ${p} × ${s} = ${[...v].join(' ou ')}`); } });
  return out;
}
function progressoSecoes(g){
  const I = g.ident, pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const idF = ['proposta','originador','pontoFocal','categoria','unidadeImpl','unidadeOrig','data','motivacao','prazoImpl','tipo'];
  const s1 = pct(idF.filter(k => !vazio(I[k])).length + (g.influencia.some(r => !vazio(r.area)) ? 1 : 0), idF.length + 1);
  const cl = [...g.classificacao, ...g.motivadores];
  const s2 = pct(cl.filter(q => !vazio(q.resp)).length + (g.problemas.length ? 1 : 0) + (g.objetivos.length ? 1 : 0), cl.length + 2);
  const s3 = g.equipe.length ? pct(g.equipe.filter(r => ['Avaliado','Não se aplica'].includes(r.status)).length, g.equipe.length) : 0;
  const s4 = g.riscos.length ? pct(g.riscos.filter(r => !vazio(r.medida) && !r.sug && !vazio(r.resp) && !vazio(r.prazo)).length, g.riscos.length) : 0;
  const s5 = g.aprovacao.length ? pct(g.aprovacao.filter(r => /^Aprovado/.test(r.status || '')).length, g.aprovacao.length) : 0;
  const s6 = g.comunicacao.length ? pct(g.comunicacao.filter(r => r.status === 'Enviada').length, g.comunicacao.length) : 0;
  const s7 = g.cronograma.length ? pct(g.cronograma.filter(r => r.status === 'Concluída').length, g.cronograma.length) : 0;
  const s8 = g.eficacia.length ? pct(g.eficacia.filter(r => r.resultado).length, g.eficacia.length) : 0;
  return [s1, s2, s3, s4, s5, s6, s7, s8];
}
const corPct = p => p >= 80 ? 'var(--good)' : p >= 40 ? 'var(--warn)' : 'var(--bad)';

/* ================= conexão ================= */
async function boot(){
  topo(); render();
  if (!window.claude || typeof claude.use !== 'function'){ S.loaded = true; render(); return; }
  let db = null, dl = null;
  try { [db, dl] = await Promise.all([claude.use('db'), claude.use('downloads')]); } catch {}
  S.dl = dl;
  if (!db){ S.loaded = true; render(); return; }
  S.db = db;
  db.doc('gm/principal').onSnapshot(s => {
    if (s.metadata && s.metadata.hasPendingWrites) return;
    if (S.dirty || S.salvando) return;
    S.gm = s.exists ? normaliza(clone(s.data())) : null;
    S.loaded = true;
    const ae = document.activeElement;
    if (ae && ae.dataset && ae.dataset.p) return;
    render();
  }, () => { S.erro = true; setSave(); });
}
let saveT;
function agendarSalvar(){ S.dirty = true; setSave(); clearTimeout(saveT); saveT = setTimeout(salvar, 900); }
async function salvar(){
  if (!S.db || !S.gm) return;
  if (S.salvando){ agendarSalvar(); return; }
  S.salvando = true; S.dirty = false; setSave();
  try { S.gm.atualizadoEm = new Date().toISOString(); await S.db.doc('gm/principal').set(clone(S.gm)); S.erro = false; }
  catch (e){ S.erro = true; S.dirty = true; toast('Não foi possível salvar' + (e && e.code ? ` (${e.code})` : '') + '. Tentando de novo…'); setTimeout(salvar, 4000); }
  S.salvando = false; setSave();
}
function setSave(){
  const el = $('#save'); if (!el) return;
  el.className = 'save' + (S.erro ? ' err' : (S.dirty || S.salvando) ? ' pend' : '');
  $('span', el).textContent = !S.db ? (S.loaded ? 'Sem conexão' : 'Conectando…') : S.erro ? 'Erro ao salvar' : (S.dirty || S.salvando) ? 'Salvando…' : 'Tudo salvo';
}
function topo(){
  const cv = $('#topo'); if (!cv) return;
  const draw = () => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    const x = cv.getContext('2d'); x.scale(dpr, dpr); x.strokeStyle = 'rgba(82,158,208,.33)'; x.lineWidth = 1;
    const W = r.width, H = r.height, cx = W * .84, cy = H * .3;
    for (let k = 1; k <= 22; k++){ x.beginPath(); for (let t = 0; t <= Math.PI * 2 + .05; t += .05){ const rr = k * 24 + Math.sin(t * 3 + k * .7) * 9 + Math.cos(t * 5 - k) * 6; const px = cx + Math.cos(t) * rr * 1.4, py = cy + Math.sin(t) * rr * .8; t === 0 ? x.moveTo(px, py) : x.lineTo(px, py); } x.stroke(); }
  };
  draw(); let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
}

/* ================= render ================= */
function render(){
  setSave();
  $$('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === UI.tab ? 'page' : 'false'));
  const v = $('#view');
  if (!S.loaded){ v.innerHTML = '<div class="lock">Carregando…</div>'; return; }
  if (!S.db){ v.innerHTML = '<div class="lock">Abra este documento pelo link do Claude para editar e salvar.</div>'; return; }
  if (!S.gm){ v.innerHTML = `<div class="lock"><p>Nenhuma gestão de mudança cadastrada ainda.</p><button class="btn pri" data-act="nova">Começar em branco</button></div>`; return; }
  const g = S.gm;
  $('#htit').textContent = 'Gestão de Mudança';
  $('#hprop').textContent = g.ident.proposta || '';
  const y = window.scrollY;
  if (UI.tab === 'painel') v.innerHTML = viewPainel(g);
  else if (UI.tab === 'doc') v.innerHTML = viewDoc(g);
  else v.innerHTML = viewPdf(g);
  window.scrollTo(0, y);
}

function viewPainel(g){
  const I = g.ident, pv = prazoVigente(g), sp = sitPrazo(pv, I.status === 'Encerrada');
  const prog = progressoSecoes(g), pr = Math.round(prog.reduce((a, b) => a + b, 0) / prog.length);
  const cr = g.cronograma, crOk = cr.filter(r => r.status === 'Concluída').length;
  const ap = g.aprovacao, apOk = ap.filter(r => /^Aprovado/.test(r.status || '')).length;
  const itens = itensComPrazo(g).filter(x => !x.feito);
  const venc = itens.filter(x => x.prazo && diffD(x.prazo, hoje()) < 0);
  const v7 = itens.filter(x => x.prazo && diffD(x.prazo, hoje()) >= 0 && diffD(x.prazo, hoje()) <= 7);
  const semP = itens.filter(x => !x.prazo && !x.acompanhamento);
  const altoSem = g.riscos.filter(r => r.antes && r.antes.c === 'Alto' && (vazio(r.medida) || r.sug)).length;
  const P = pendencias(g);
  const prox = itens.filter(x => x.prazo).sort((a, b) => a.prazo.localeCompare(b.prazo)).slice(0, 8);
  const cnt = (k, c) => g.riscos.filter(r => r[k] && r[k].c === c).length;
  const barra = k => { const t = g.riscos.length || 1; return `<div class="t">${CLS.slice().reverse().map(c => { const n = cnt(k, c); return n ? `<i style="flex:${n};background:${c === 'Alto' ? 'var(--bad)' : c === 'Médio' ? 'var(--warn)' : 'var(--good)'}" title="${c}: ${n}">${n}</i>` : ''; }).join('')}</div>`; };
  return `
  <div class="big">
    <div class="bc ${sp.k === 'bad' ? 'alert' : ''}"><span class="l">Prazo de implementação${I.prazoRevisado ? ' (revisado)' : ''}</span><span class="v">${pv ? fmtD(pv) : 'Sem prazo'}</span><span class="s" style="${sp.k === 'bad' ? 'color:var(--bad);font-weight:700' : ''}">${esc(sp.t)}${I.prazoRevisado ? ` · original ${fmtD(I.prazoImpl)}` : ''}</span></div>
    <div class="bc"><span class="l">Documento preenchido</span><span class="v">${pr}%</span><div class="meter"><i style="width:${pr}%;background:${corPct(pr)}"></i></div></div>
    <div class="bc"><span class="l">Cronograma concluído</span><span class="v">${crOk}/${cr.length}</span><div class="meter"><i style="width:${cr.length ? crOk / cr.length * 100 : 0}%;background:${corPct(cr.length ? crOk / cr.length * 100 : 0)}"></i></div></div>
    <div class="bc"><span class="l">Aprovações</span><span class="v">${apOk}/${ap.length}</span><span class="s">${ap.length - apOk ? plural(ap.length - apOk,'pendente','pendentes') : 'Todas aprovadas'}</span></div>
  </div>
  <div class="kpis">
    <button class="kpi" style="--c:var(--bad)" data-go="s7"><b>${venc.length}</b><span>Itens vencidos</span></button>
    <button class="kpi" style="--c:var(--warn)" data-go="s7"><b>${v7.length}</b><span>Vencem em até 7 dias</span></button>
    <button class="kpi" style="--c:var(--info)" data-go="s7"><b>${semP.length}</b><span>Sem prazo definido</span></button>
    <button class="kpi" style="--c:${altoSem ? 'var(--bad)' : 'var(--good)'}" data-go="s4"><b>${altoSem}</b><span>Riscos altos sem medida</span></button>
    <button class="kpi" style="--c:var(--ink)" data-go="s1"><b>${P.length}</b><span>Pendências no documento</span></button>
  </div>
  <div class="cols">
    <section class="panel"><h2>O que está faltando <small>${plural(P.filter(p => p.sev === 'alta').length,'crítica','críticas')}</small></h2>
      <div class="falta">${P.length ? P.map(p => `<button class="fi" data-go="${p.sec}"><span class="tag ${p.sev}">${p.sev === 'alta' ? 'Crítico' : p.sev === 'media' ? 'Atenção' : 'Revisar'}</span><span><b>${esc(p.t)}</b><small>${esc(p.d || '')}</small></span><span class="go">Seção ${p.sec.slice(1)} ›</span></button>`).join('') : '<p class="muted" style="margin:0">Nada pendente. O documento está completo.</p>'}</div>
    </section>
    <div style="display:grid;gap:14px;align-content:start">
      <section class="panel"><h2>Próximos prazos</h2>
        ${prox.length ? prox.map(x => { const s = sitPrazo(x.prazo, false); return `<button class="pz" data-go="${x.sec}"><span class="pzd" style="color:${s.k === 'bad' ? 'var(--bad)' : s.k === 'warn' ? 'var(--warn)' : 'var(--ink)'}">${fmtD(x.prazo).slice(0,5)}<small>${esc(s.t)}</small></span><span><b>${esc(x.grupo)} ${esc(x.id)}</b> ${esc(x.t || '')}${x.resp ? `<small class="muted" style="display:block">${esc(x.resp)}</small>` : ''}</span></button>`; }).join('') : `<p class="muted" style="margin:0">Nenhum item com prazo. Defina os prazos no cronograma, nas medidas de risco e na comunicação.</p>`}
      </section>
      <section class="panel"><h2>Perfil de risco <small>${plural(g.riscos.length,'risco')}</small></h2>
        <div class="rbars"><div class="rb"><span>Antes da melhoria</span>${barra('antes')}</div><div class="rb"><span>Depois (projetado)</span>${barra('depois')}</div></div>
        <div class="legend"><span><i style="background:var(--bad)"></i>Alto</span><span><i style="background:var(--warn)"></i>Médio</span><span><i style="background:var(--good)"></i>Baixo</span></div>
      </section>
      <section class="panel"><h2>Andamento por seção</h2>
        <div class="secs">${SECOES.slice(0, 8).map((s, i) => `<button class="sr" data-go="${s.id}"><em>${s.n}</em><span>${esc(s.t)}<div class="meter" style="margin-top:4px"><i style="width:${prog[i]}%;background:${corPct(prog[i])}"></i></div></span><span class="v">${prog[i]}%</span></button>`).join('')}</div>
      </section>
    </div>
  </div>`;
}

/* ---------- componentes de edição ---------- */
function fld(p, label, type = 'text', opts = {}){
  const v = getPath(S.gm, p) ?? '';
  const cls = `inp ${opts.req && vazio(v) ? 'vazio' : ''}`;
  const id = 'f_' + p.replace(/\W/g, '_');
  let ctl;
  if (type === 'textarea') ctl = `<textarea class="${cls}" id="${id}" data-p="${p}" rows="${opts.rows || 2}">${esc(v)}</textarea>`;
  else if (type === 'select') ctl = `<select class="${cls}" id="${id}" data-p="${p}">${opts.vazio !== false ? '<option value="">—</option>' : ''}${opts.opts.map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  else ctl = `<input class="${cls}" id="${id}" type="${type}" data-p="${p}" value="${esc(v)}"${opts.list ? ` list="${opts.list}"` : ''}>`;
  return `<label class="f ${opts.full ? 'full' : ''}">${esc(label)}${ctl}</label>`;
}
function seg3(p){ const v = getPath(S.gm, p) || ''; return `<span class="seg3">${['Sim','Não','NA'].map(o => `<button type="button" data-seg="${p}" data-v="${o}" aria-pressed="${v === o}">${o === 'NA' ? 'N/A' : o}</button>`).join('')}</span>`; }
function linha(key, i, titulo, badges, corpo){
  const r = S.gm[key][i];
  return `<div class="row"><div class="rowh"><span class="id">${esc(titulo)}</span>${r.sug ? '<span class="pill sug">Sugestão</span>' : ''}${badges || ''}<span class="sp"></span><button class="rm" data-rm="${key}" data-i="${i}">Excluir</button></div>${corpo}</div>`;
}
const addBtn = (key, txt) => `<button class="add" data-add="${key}">+ ${esc(txt)}</button>`;
const listaPessoas = () => `<datalist id="dlPessoas">${[...new Set(S.gm.equipe.map(r => r.nome).filter(Boolean).concat(S.gm.aprovacao.map(r => r.nome).filter(Boolean), [S.gm.ident.acompanhamento].filter(Boolean)))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>`;
function badgePrazo(prazo, feito){ const s = sitPrazo(prazo, feito); return `<span class="pill ${s.k === 'ok' ? '' : s.k}">${esc(s.t)}</span>`; }

function viewDoc(g){
  const s = UI.sec;
  const prog = progressoSecoes(g);
  const nav = `<nav class="snav" aria-label="Seções do documento">${SECOES.map((x, i) => `<button data-sec="${x.id}" aria-current="${x.id === s}" style="--c:${i < 8 ? corPct(prog[i]) : (g.org.aplicavel ? 'var(--info)' : 'var(--line)')}"><i></i>${x.n}. ${esc(x.t)}</button>`).join('')}</nav>`;
  const sec = SECOES.find(x => x.id === s);
  const head = `<div class="sech"><span class="n">${sec.n}.</span><h2>${esc(sec.t)}</h2></div>`;
  return nav + `<section class="sec">${head}${listaPessoas()}${SEC[s](g)}</section>`;
}

/* ================= PDF (A4 horizontal) ================= */
const PW = 297, PH = 210, M = 12, CW = PW - 2 * M, BOT = PH - 13;
const NAVY = [13,56,91], ORANGE = [247,131,0], BAD = [198,47,40], WARN = [184,116,10], GOOD = [46,139,87], INFO = [31,111,178], GREY = [110,122,132], INK = [27,39,51];
const TX = s => String(s ?? '').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—−]/g,'-').replace(/[•·]/g,'-').replace(/…/g,'...').replace(/×/g,'x').replace(/[^\x00-\xFF\n]/g,'');
const clara = (c, k = .88) => c.map(v => Math.round(v + (255 - v) * k));
const imgDim = src => new Promise(ok => { const i = new Image(); i.onload = () => ok({w:i.naturalWidth, h:i.naturalHeight}); i.onerror = () => ok(null); i.src = src; });
async function pdfGM(opt){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
  const g = clone(S.gm);
  if (!opt.sug) ['cronograma','indicadores','comunicacao'].forEach(k => g[k] = g[k].filter(r => !r.sug));
  if (!opt.sug) g.riscos.forEach(r => { if (r.sug){ r.medida = ''; } });
  const lg = await imgDim(LOGO), sl = await imgDim(SELO);
  const c = {y:0};
  const cab = (titulo, sub) => {
    const H = 14;
    if (lg){ const s = Math.min(30 / lg.w, H / lg.h); doc.addImage(LOGO, 'PNG', M, 8 + (H - lg.h * s) / 2, lg.w * s, lg.h * s, 'lg', 'FAST');
      let x = M + lg.w * s + 4; doc.setDrawColor(...NAVY); doc.setLineWidth(.3); doc.line(x, 9.5, x, 8 + H - 1.5);
      if (sl){ x += 4; const s2 = Math.min(28 / sl.w, 11 / sl.h); doc.addImage(SELO, 'PNG', x, 8 + (H - sl.h * s2) / 2, sl.w * s2, sl.h * s2, 'sl', 'FAST'); } }
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(...NAVY);
    doc.text(TX(titulo), M + CW, 15, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.setTextColor(91,105,117);
    doc.text(TX(sub), M + CW, 20.5, {align:'right'});
    doc.setFillColor(...NAVY); doc.rect(M, 25, CW - 40, 1.2, 'F'); doc.setFillColor(...ORANGE); doc.rect(M + CW - 40, 25, 40, 1.2, 'F');
    c.y = 31;
  };
  const nova = () => { doc.addPage(); cab('Gestão de Mudança', TX((g.ident.proposta || '').slice(0, 120) + ((g.ident.proposta || '').length > 120 ? '...' : ''))); };
  const ensure = h => { if (c.y + h > BOT) nova(); };
  const secao = (t, extra = 0) => {
    ensure(12 + extra);
    doc.setFillColor(...ORANGE); doc.rect(M, c.y, 1.4, 5.2, 'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(...NAVY); doc.text(TX(t), M + 4, c.y + 4.2);
    c.y += 8;
  };
  const tabela = (cols, rows, o = {}) => {
    const tot = cols.reduce((a, x) => a + x.w, 0), ws = cols.map(x => x.w / tot * CW);
    const fs = o.fs || 7.6, lh = fs * .42;
    const head = () => {
      doc.setFont('helvetica','bold'); doc.setFontSize(7.4);
      const hl = cols.map((x, j) => doc.splitTextToSize(TX(x.h), ws[j] - 3));
      const h = Math.max(...hl.map(l => l.length)) * 3.1 + 3.2;
      ensure(h + 8);
      doc.setFillColor(...NAVY); doc.rect(M, c.y, CW, h, 'F'); doc.setTextColor(255,255,255);
      let x = M; hl.forEach((l, j) => { doc.text(l, x + 1.5, c.y + 3.6); x += ws[j]; });
      c.y += h;
    };
    head();

  }
  nova();

    g.riscos.map(r => { const a = r.antes || {}, d = r.depois || {}; return [{t:'R' + (r.n || ''), b:true}, {t:r.area}, {t:r.situacao}, {t:r.consequencia}, {t:a.p}, {t:a.s}, clsCell(a.c), {t:d.p}, {t:d.s}, clsCell(d.c), {t:(r.medida || 'A definir') + (r.sug ? '\n(sugerida)' : ''), c:r.medida ? INK : BAD}, {t:r.resp || 'A definir', c:r.resp ? INK : BAD}, prazoCell(r.prazo, r.status === 'Implementada')]; }), {fs:7});
  ensure(10); doc.setFont('helvetica','bold'); doc.setFontSize(8.4); doc.setTextColor(...NAVY);
  doc.text(TX('Metodologia de análise: ' + ([...g.metodologia.ferramentas, g.metodologia.outras].filter(Boolean).join(', ') || 'não informada')), M, c.y + 2); c.y += 8;
  secao('5. Aprovação da mudança', 16);
  tabela([{h:'Aprovador', w:16}, {h:'Especialidade', w:11}, {h:'Empresa', w:9}, {h:'E-mail', w:22}, {h:'Comentários', w:32}, {h:'Data', w:9}, {h:'Status', w:13}],
    g.aprovacao.map(r => [{t:r.nome, b:true}, {t:r.esp}, {t:r.empresa}, {t:r.email}, {t:r.coment}, {t:fmtD(r.data)}, {t:r.status || 'Em análise', b:true, c:/^Aprovado/.test(r.status || '') ? GOOD : r.status === 'Reprovado' ? BAD : WARN}]));

    g.comunicacao.map(r => [{t:r.id, b:true}, {t:r.oque + (r.sug ? '\n(sugerida)' : '')}, {t:r.emite}, {t:r.recebe}, {t:r.meio}, prazoCell(r.prazo, r.status === 'Enviada'), {t:r.status || 'Pendente', c:r.status === 'Enviada' ? GOOD : WARN, b:true}]));
  secao('7.1 Cronograma de implementação', 16);
  tabela([{h:'ID', w:5}, {h:'Detalhamento da ação', w:48}, {h:'Responsável', w:16}, {h:'Prazo', w:12}, {h:'Situação', w:11}, {h:'Concluída em', w:9}, {h:'Observação / evidência', w:24}],
    g.cronograma.map(r => { const f = ['Concluída','Cancelada'].includes(r.status); return [{t:r.id, b:true}, {t:r.acao + (r.sug ? '\n(sugerida)' : '')}, {t:r.resp || 'A definir', c:r.resp ? INK : BAD}, prazoCell(r.prazo, f), {t:r.status || 'Não iniciada', b:true, c:r.status === 'Concluída' ? GOOD : r.status === 'Em andamento' ? INFO : GREY}, {t:fmtD(r.conclusao)}, {t:r.obs}]; }));
  secao('7.2 Indicadores para avaliação de eficácia', 16);

    g.indicadores.map(r => [{t:r.id, b:true}, {t:r.indicador + (r.sug ? '\n(sugerido)' : '')}, {t:r.formula}, {t:r.meta || 'A definir', c:r.meta ? INK : BAD}, {t:r.resp || 'A definir', c:r.resp ? INK : BAD}, {t:r.prazo ? fmtD(r.prazo) : 'A definir'}]));

  tabela([{h:'Nº', w:4}, {h:'Lições aprendidas', w:114}], g.licoes.filter(x => x.t).map((x, i) => [{t:String(i + 1), b:true}, {t:x.t}]), {vazio:'A preencher no encerramento.'});
  if (g.org.aplicavel){
    nova(); secao('9. Mudanças em estrutura organizacional');
    tabela([{h:'Nível gerencial', w:20}, {h:'Próprios as is', w:8}, {h:'Var.', w:6}, {h:'To be', w:6}, {h:'Terceiros as is', w:8}, {h:'Var.', w:6}, {h:'To be', w:6}, {h:'Racional', w:30}], g.headcount.map(r => [{t:r.nivel, b:true}, {t:r.pa}, {t:r.pv}, {t:r.pt}, {t:r.ta}, {t:r.tv}, {t:r.tt}, {t:r.rac}]));
    [['transferencias','9.2 Transferência de escopo',['area','escopo','destino','obj'],['Área','Escopo','Destino','Objetivo']],['incorporacoes','9.3 Incorporação de escopo',['area','escopo','cedente','obj'],['Área','Escopo','Cedente','Objetivo']],['novasAreas','9.4 Novas áreas',['area','escopo','reporta','obj'],['Área','Escopo','Reporta-se à','Objetivo']],['inativacoes','9.5 Inativação de áreas',['area','escopo','migra','obj'],['Área','Escopo','Migra para','Objetivo']],['excecoes','9.6 Exceções',['tipo','desc','just','obj'],['Tipo','Descrição','Justificativa','Objetivo']]].forEach(([k, t, ks, hs]) => { secao(t, 14); tabela(hs.map(h => ({h, w:1})), g[k].map(r => ks.map(x => ({t:r[x]})))); });
    secao('9.7 Plano de monitoramento', 14);
    tabela([{h:'Ação', w:50}, {h:'Responsável', w:16}, {h:'Início', w:10}, {h:'Final', w:12}, {h:'Status', w:10}], g.monitoramento.map(r => [{t:r.acao}, {t:r.resp}, {t:fmtD(r.inicio)}, prazoCell(r.fim, r.status === 'Concluída'), {t:r.status}]));

  const np = doc.getNumberOfPages();
  for (let i = 1; i <= np; i++){

    doc.setFillColor(213,220,225); doc.rect(M, PH - 9.3, CW, .3, 'F');

    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(120,130,140);

    doc.text(`Página ${i} de ${np}`, M + CW, PH - 5.5, {align:'right'});

}
async function salvarArquivo(nome, data){
  if (!S.dl){ toast('Download indisponível nesta visualização.'); return; }
  try { await S.dl.save({filename:nome, data}); } catch (e){ if (!e || e.code !== 'declined') toast('Não foi possível baixar' + (e && e.code ? ` (${e.code})` : '') + '.'); }
}

/* ================= eventos ================= */
document.addEventListener('click', async e => {
  const t = e.target.closest('button,[data-go]'); if (!t) return;
  const d = t.dataset;
  if (d.tab){ UI.tab = d.tab; render(); window.scrollTo(0, 0); return; }
  if (d.go){ UI.tab = 'doc'; UI.sec = d.go; render(); window.scrollTo(0, 0); return; }
  if (d.sec){ UI.sec = d.sec; render(); window.scrollTo(0, 0); return; }
  if (d.seg){ const atual = getPath(S.gm, d.seg); setPath(S.gm, d.seg, atual === d.v ? '' : d.v); agendarSalvar(); render(); return; }
  if (d.add){ S.gm[d.add].push(NOVO[d.add]()); agendarSalvar(); render(); const rows = $$('.row'); const last = rows[rows.length - 1]; if (last){ last.scrollIntoView({block:'center'}); const f = $('.inp', last); if (f) f.focus(); } return; }
  if (d.rm){ if (!(await confirmar('Excluir esta linha?', 'Excluir'))) return; S.gm[d.rm].splice(+d.i, 1); agendarSalvar(); render(); return; }
  if (d.act === 'nova'){ S.gm = normaliza({}); agendarSalvar(); render(); return; }
  if (d.act === 'pdf'){
    if (!window.jspdf){ toast('O gerador de PDF não carregou. Recarregue a página.'); return; }
    const html = t.innerHTML; t.disabled = true; t.textContent = 'Gerando PDF…';
    try { const doc = await pdfGM({painel:$('#pdfPainel').checked, sug:$('#pdfSug').checked, ass:$('#pdfAss').checked}); await salvarArquivo(`Gestao_de_Mudanca_${hoje()}.pdf`, doc.output('blob')); }
    catch (err){ console.error(err); toast('Não foi possível gerar o PDF.'); }
    t.disabled = false; t.innerHTML = html; return;
  }
  if (d.act === 'backup'){ await salvarArquivo(`Gestao_de_Mudanca_dados_${hoje()}.json`, JSON.stringify(S.gm, null, 2)); return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.p && S.gm){
    setPath(S.gm, el.dataset.p, el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value);
    const m = el.dataset.p.match(/^(\w+)\.(\d+)\./);
    if (m && S.gm[m[1]] && S.gm[m[1]][+m[2]] && S.gm[m[1]][+m[2]].sug){ S.gm[m[1]][+m[2]].sug = false; }
    el.classList.remove('vazio');
    agendarSalvar();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.ferr){ const l = S.gm.metodologia.ferramentas; const i = l.indexOf(el.dataset.ferr); if (el.checked && i < 0) l.push(el.dataset.ferr); if (!el.checked && i >= 0) l.splice(i, 1); agendarSalvar(); return; }
  if (el.id === 'orgAplic'){ S.gm.org.aplicavel = el.checked; agendarSalvar(); render(); return; }
  if (el.dataset.p && (el.tagName === 'SELECT' || el.type === 'date')) render();
});
document.addEventListener('focusout', e => { if (e.target.dataset && e.target.dataset.p && e.target.tagName !== 'SELECT') setTimeout(() => { const ae = document.activeElement; if (!(ae && ae.dataset && ae.dataset.p)) render(); }, 60); });
boot();
