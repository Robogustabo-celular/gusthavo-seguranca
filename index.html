    <div class="fsec"><h3>Fotos de depois</h3>${fotosHTML(F.fotosDepois, 'pa-depois', 8)}</div>`;
  abrirSheet('paconcl', `Concluir ${a.codigo}`, c, `<div class="actions" style="margin:0"><button class="btn" data-paact="voltar-det" data-id="${a.id}">Voltar</button><button class="btn hi" data-paact="concluir-salvar">Confirmar conclusão</button></div>`);
}
async function paSalvarConcl(btn){
  const a = F.a;
  if (!(F.evid || '').trim()) return toast('Descreva o que foi feito.');
  if (!F.fotosDepois.length && !(await confirmar('Concluir sem foto de depois? O relatório fica sem a comparação.'))) return;
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    a.fotosAntes = await paSubir(F.fotosAntes);

async function paPdfAcao(a){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const cf = await cfgPDF();
  const p = PA.planos.find(x => x.id === a.plano) || {};
  const concl = a.status === 'concluida';
  const cor = concl ? COR.ok : PA_PR[a.prioridade].rgb;
  const s = paSit(a);
  const c = mkCtx(doc, cf, a.codigo, cor);
  c.y = cabecalho(doc, cf, concl ? 'Registro de adequação concluída' : 'Notificação de adequação', `${p.nome || 'Plano de ação'}${a.frente ? ' | ' + a.frente : ''}`, a.codigo, cor, a.impeditivo && paAberta(a), `Emitido em ${fmtDH(new Date())}`);
  const msg = concl ? `Adequação concluída em ${a.conclusao ? fmtData(a.conclusao.data) : '-'}.` : (a.impeditivo ? 'Ação impeditiva: a operação não pode iniciar até a conclusão desta adequação.' : `Adequação de prioridade ${PA_PR[a.prioridade].nome.toLowerCase()} a cumprir ${a.prazo ? 'até ' + fmtData(a.prazo) : 'no prazo a definir'}.`);
  const sub = concl ? (a.prazo && a.conclusao ? (a.conclusao.data <= a.prazo ? 'Cumprida dentro do prazo.' : 'Cumprida fora do prazo.') : '') : (a.prazo ? s.t + '.' : 'Prazo ainda não definido.');
  banner(c, msg, sub);
  secao(c, 'Identificação');
  grade(c, [
    {l:'Código', v:a.codigo}, {l:'Prioridade', v:PA_PR[a.prioridade].nome, cor:PA_PR[a.prioridade].rgb}, {l:'Impeditiva', v:a.impeditivo ? 'Sim' : 'Não', cor:a.impeditivo ? COR.interd : null}, {l:'Situação', v:PA_ST[a.status].nome, cor:PA_ST[a.status].rgb},
    {l:'Responsável', v:pNome(a.responsavel) || 'A definir'}, {l:'Empresa do responsável', v:pEmp(a.responsavel) || '-'}, {l:'Apoio', v:pNome(a.apoio) || '-'}, {l:'Empresa do apoio', v:pEmp(a.apoio) || '-'},
    {l:'Prazo', v:a.prazo ? fmtData(a.prazo) : 'A definir'}, {l:'Frente', v:a.frente || '-'}, {l:'Origem', v:a.origem ? a.origem.numero : (p.nome || '-'), span:2},
  ], 4);
  cartoes(c, [{titulo:'Ação requerida', texto:a.acao, cor:PA_PR[a.prioridade].rgb}]);
  if (a.contexto) cartoes(c, [{titulo:a.origem ? 'Irregularidade constatada' : 'Contexto', texto:a.contexto, cor:[82,158,208]}]);
  if (a.observacao) cartoes(c, [{titulo:'Observações', texto:a.observacao, cor:[110,122,132]}]);
  if (concl && a.evidencia) cartoes(c, [{titulo:'O que foi feito', texto:a.evidencia, cor:COR.ok}]);
  const pessoas = [{nome:paTec(), cargo:((cfg().inspetores || [])[0] || {}).cargo || 'Segurança do Trabalho'}];
  if (pNome(a.responsavel)) pessoas.push({nome:pNome(a.responsavel), cargo:['Responsável', pEmp(a.responsavel)].filter(Boolean).join(' - ')});
  if (pNome(a.apoio)) pessoas.push({nome:pNome(a.apoio), cargo:['Apoio', pEmp(a.apoio)].filter(Boolean).join(' - ')});
  const sigH = sigAltura(pessoas.length);
  const A = a.fotosAntes || [], D = a.fotosDepois || [];
  if (A.length > 4 || D.length > 4){
    if (A.length) await fotosFluxo(c, A, 'Antes', COR.interd, D.length ? 0 : sigH);
    if (D.length) await fotosFluxo(c, D, 'Depois', COR.ok, sigH);
  } else await fotosRegistro(c, [{titulo:'Antes', fotos:A, cor:COR.interd}, {titulo:'Depois', fotos:D, cor:COR.ok}], sigH);
  assinaturasRodape(c, pessoas);
  rodapes(doc, cf);
  return doc;
}

let PAC = null;
async function paFotoPub(ref){
  const src = await fotoSrc(ref); if (!src) return '';
  const img = await carregarImg(src);
  const s = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', .66);
}
async function paMontarPacote(p, onProg){
  const l = paDoPlano(p.id).sort(paOrdena);
  const fotos = {}, refs = [];
  const conv = lista => (lista || []).map(f => { const k = refKey(f.ref).replace(/[^\w:-]/g, '_'); refs.push([k, f.ref]); return {f:k, legenda:f.legenda || ''}; });
  const acoes = l.map(a => ({id:a.id, codigo:a.codigo, ordem:a.ordem, frente:a.frente || '', contexto:a.contexto || '', acao:a.acao, prioridade:a.prioridade, impeditivo:!!a.impeditivo, status:a.status,
    responsavel:{nome:pNome(a.responsavel), empresa:pEmp(a.responsavel)}, apoio:{nome:pNome(a.apoio), empresa:pEmp(a.apoio)}, prazo:a.prazo || '', observacao:a.observacao || '', evidencia:a.evidencia || '',
    conclusao:a.conclusao || null, historico:(a.historico || []).map(h => ({data:h.data, hora:h.hora || '', texto:h.texto, tipo:h.tipo || '', por:h.por || ''})), origemNumero:a.origem ? a.origem.numero : '',
    fotosAntes:conv(a.fotosAntes), fotosDepois:conv(a.fotosDepois)}));
  let n = 0;
  for (const [k, ref] of refs){
    n++; onProg && onProg(n, refs.length);
    if (fotos[k]) continue;
    try { fotos[k] = await paFotoPub(ref); } catch { fotos[k] = ''; }
  }
  return {tipo:'concremat-plano', v:1, geradoEm:new Date().toISOString(), plano:{id:p.id, nome:p.nome, descricao:p.descricao || ''}, acoes, fotos};
}

/* ================= dashboard do processo (plano de ação) ================= */
const DZ = {resp:'', emp:'', frente:'', pr:'', st:'', prazo:'', imp:false, q:'', ord:'codigo', dir:1, tudo:false};
const DZ_ST = [
  {k:'concluida', nome:'Concluída', css:'var(--ok)', svg:'var(--ok)'},
  {k:'andamento', nome:'Em andamento', css:'repeating-linear-gradient(135deg,var(--interv) 0 5px,color-mix(in srgb,var(--interv) 42%,var(--surface)) 5px 10px)', svg:'url(#dzHatch)'},
  {k:'nao_iniciada', nome:'Não iniciada', css:'var(--dz-nao)', svg:'var(--dz-nao)'},
];
const DZ_PZ = [
  {k:'venc', nome:'Vencidas', cor:'var(--interd)'},
  {k:'d7', nome:'Vencem em até 7 dias', cor:'var(--notif)'},
  {k:'d30', nome:'Em 8 a 30 dias', cor:'var(--interv)'},
  {k:'mais', nome:'Mais de 30 dias', cor:'var(--sky)'},
  {k:'semp', nome:'Sem prazo', cor:'var(--dz-nao)'},
];
const paDashAtivo = () => { try { return /\/(dashboard|painel)$/i.test(decodeURIComponent((location.hash || '').slice(1)).trim()); } catch { return false; } };
const paDashLink = p => paLink(p) + '/dashboard';
const dzResp = a => pNome(a.responsavel) || 'A definir';
const dzEmp = a => pEmp(a.responsavel) || 'Sem empresa';
function dzPrazo(a){
  if (a.status === 'concluida') return 'ok';
  if (!a.prazo) return 'semp';
  const d = diffDias(a.prazo, hojeISO());
  return d < 0 ? 'venc' : d <= 7 ? 'd7' : d <= 30 ? 'd30' : 'mais';
}
const dzDia = s => s ? String(s).slice(0, 10) : '';
function dzFiltrar(l, sem){
  const q = DZ.q.trim().toLowerCase();
  return l.filter(a =>
    (sem === 'resp' || !DZ.resp || dzResp(a) === DZ.resp) &&
    (sem === 'emp' || !DZ.emp || dzEmp(a) === DZ.emp) &&
    (sem === 'frente' || !DZ.frente || (a.frente || 'Sem frente') === DZ.frente) &&
    (sem === 'pr' || !DZ.pr || a.prioridade === DZ.pr) &&
    (sem === 'st' || !DZ.st || a.status === DZ.st) &&
    (sem === 'prazo' || !DZ.prazo || dzPrazo(a) === DZ.prazo) &&
    (!DZ.imp || (a.impeditivo && paAberta(a))) &&
    (!q || [a.codigo, a.acao, a.frente, a.contexto, pNome(a.responsavel), pEmp(a.responsavel), pNome(a.apoio)].join(' ').toLowerCase().includes(q)));
}
const dzConta = (l, k) => l.filter(a => a.status === k).length;
const dzTip = t => `data-tip="${esc(t)}"`;

/* barra empilhada por status (HTML) */
function dzBarra(g, max){
  const tot = g.length || 1, w = max ? g.length / max * 100 : 100;
  return `<div class="dz-bar" style="width:${Math.max(w, 2)}%">${DZ_ST.map(s => { const n = dzConta(g, s.k); return n ? `<i style="flex:${n};background:${s.css}" ${dzTip(`${s.nome}: ${n} de ${g.length} (${Math.round(n / tot * 100)}%)`)}></i>` : ''; }).join('')}</div>`;
}
function dzLinhas(grupos, dim, max, sub){
  if (!grupos.length) return `<p class="dz-vazio">Nenhuma ação com esses filtros.</p>`;
  return `<div class="dz-rows">${grupos.map(([nome, g]) => {
    const ok = dzConta(g, 'concluida'), on = DZ[dim] === nome;
    return `<button class="dz-row ${on ? 'on' : ''} ${DZ[dim] && !on ? 'off' : ''}" data-dz="${dim}" data-v="${esc(nome)}" aria-pressed="${on}">
      <span class="dz-rl"><b>${esc(nome)}</b>${sub ? `<small>${esc(sub(nome, g))}</small>` : ''}</span>
      <span class="dz-rb">${dzBarra(g, max)}</span>
      <span class="dz-rn"><b>${ok}</b>/${g.length}<small>${g.length ? Math.round(ok / g.length * 100) : 0}%</small></span>
    </button>`;
  }).join('')}</div>`;
}
function dzAgrupa(l, fn){
  const m = new Map(); l.forEach(a => { const k = fn(a); if (!m.has(k)) m.set(k, []); m.get(k).push(a); });
  return [...m.entries()];
}

/* rosca de status (SVG) */
function dzRosca(l){
  const tot = l.length, R = 78, r = 56, cx = 100, cy = 100;
  const pct = tot ? Math.round(dzConta(l, 'concluida') / tot * 100) : 0;
  let ang = -Math.PI / 2;
  const segs = DZ_ST.map(s => ({s, n:dzConta(l, s.k)})).filter(x => x.n);
  const gap = segs.length > 1 ? 0.035 : 0;
  const arcos = segs.map(({s, n}) => {
    const a0 = ang + gap / 2, a1 = ang + n / tot * Math.PI * 2 - gap / 2; ang += n / tot * Math.PI * 2;
    const big = a1 - a0 > Math.PI ? 1 : 0, P = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(2)} ${(cy + rad * Math.sin(a)).toFixed(2)}`;
    const d = segs.length === 1 ? `M ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx - .01} ${cy - R} L ${cx - .01} ${cy - r} A ${r} ${r} 0 1 0 ${cx} ${cy - r} Z`
      : `M ${P(R, a0)} A ${R} ${R} 0 ${big} 1 ${P(R, a1)} L ${P(r, a1)} A ${r} ${r} 0 ${big} 0 ${P(r, a0)} Z`;
    const on = DZ.st === s.k;
    return `<path d="${d}" fill="${s.svg}" class="dz-arc ${on ? 'on' : ''} ${DZ.st && !on ? 'off' : ''}" data-dz="st" data-v="${s.k}" ${dzTip(`${s.nome}: ${n} de ${tot} (${Math.round(n / tot * 100)}%)`)}/>`;
  }).join('');
  return `<svg viewBox="0 0 200 200" class="dz-donut" role="img" aria-label="${pct}% concluído">
    <defs><pattern id="dzHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" style="fill:color-mix(in srgb,var(--interv) 42%,var(--surface))"/><rect width="4" height="8" style="fill:var(--interv)"/></pattern></defs>
    ${tot ? arcos : `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="var(--surface2)" stroke-width="${R - r}"/>`}
    <text x="100" y="98" text-anchor="middle" class="dz-dn">${pct}%</text><text x="100" y="122" text-anchor="middle" class="dz-dl">concluído</text></svg>`;
}

/* evolução acumulada das conclusões (SVG, eixo único) */
function dzEvolucao(l){
  const tot = l.length;
  const concl = l.filter(a => a.status === 'concluida').map(a => dzDia(a.conclusao && a.conclusao.data) || dzDia(a.atualizadoEm)).filter(Boolean).sort();
  const ini = l.map(a => dzDia(a.criadoEm)).filter(Boolean).sort()[0] || hojeISO();
  const inicio = [ini, concl[0] || ini].sort()[0];
  const fim = hojeISO();
  const nd = Math.max(1, diffDias(fim, inicio));
  const pts = []; let acc = 0, j = 0;
  for (let i = 0; i <= nd; i++){ const d = addDias(inicio, i); while (j < concl.length && concl[j] <= d){ acc++; j++; } pts.push({d, v:acc}); }
  const W = 640, H = 230, L = 36, Rm = 14, T = 16, B = 30, ymax = Math.max(1, tot);
  const X = i => L + (nd ? i / nd : 1) * (W - L - Rm), Y = v => T + (1 - v / ymax) * (H - T - B);
  const linha = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const area = `${linha} L${X(nd).toFixed(1)} ${Y(0)} L${X(0).toFixed(1)} ${Y(0)} Z`;
  const yt = [0, Math.round(ymax / 2), ymax].filter((v, i, a) => a.indexOf(v) === i);
  const nx = Math.min(5, nd + 1), xt = [...new Set(Array.from({length:nx}, (_, k) => Math.round(k * nd / Math.max(1, nx - 1))))];
  const ult = pts[pts.length - 1];
  window._dzPts = {pts, tot, X, Y, W, H, T, B};
  return `<div class="dz-evo"><svg viewBox="0 0 ${W} ${H}" class="dz-line" role="img" aria-label="Ações concluídas acumuladas: ${ult.v} de ${tot}">
    ${yt.map(v => `<line x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}" class="dz-grid"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end" class="dz-ax">${v}</text>`).join('')}
    ${xt.map(i => `<text x="${X(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === nd ? 'end' : 'middle'}" class="dz-ax">${fmtCurta(pts[i].d)}</text>`).join('')}
    <line x1="${L}" x2="${W - Rm}" y1="${Y(tot)}" y2="${Y(tot)}" class="dz-meta"/><text x="${W - Rm}" y="${Y(tot) - 6}" text-anchor="end" class="dz-metal">Meta: ${plural(tot, 'ação', 'ações')}</text>
    <path d="${area}" class="dz-area"/><path d="${linha}" class="dz-l"/>
    <circle cx="${X(nd)}" cy="${Y(ult.v)}" r="5" class="dz-dot"/>
    <text x="${Math.max(L + 40, X(nd) - 10)}" y="${Math.max(T + 12, Y(ult.v) - 12)}" text-anchor="end" class="dz-lab">${ult.v} concluída${ult.v === 1 ? '' : 's'}</text>
    <line class="dz-cross" x1="0" x2="0" y1="${T}" y2="${H - B}" style="display:none"/><circle class="dz-cdot" r="5" style="display:none"/>
    <rect x="${L}" y="${T}" width="${W - L - Rm}" height="${H - T - B}" class="dz-hit"/>
  </svg>${concl.length ? '' : '<p class="dz-vazio" style="margin-top:6px">Nenhuma ação concluída ainda. A curva sobe conforme as ações forem concluídas.</p>'}</div>`;
}

/* prazos em faixas */
function dzPrazos(l){
  const ab = dzFiltrar(l, 'prazo').filter(paAberta), max = Math.max(1, ...DZ_PZ.map(z => ab.filter(a => dzPrazo(a) === z.k).length));
  return `<div class="dz-pz">${DZ_PZ.map(z => { const n = ab.filter(a => dzPrazo(a) === z.k).length, on = DZ.prazo === z.k;

      <span>${z.nome}</span><span class="dz-pzt">${n ? `<i style="width:${n / max * 100}%;background:${z.cor}"></i>` : ''}</span><b>${n}</b></button>`; }).join('')}</div>
    <p class="dz-nota">Só ações em aberto. Toque numa faixa para filtrar.</p>`;
}

function dzAtividade(l){
  const ev = [];
  l.forEach(a => (a.historico || []).forEach(h => ev.push({a, h})));
  ev.sort((x, y) => ((y.h.data || '') + (y.h.hora || '')).localeCompare((x.h.data || '') + (x.h.hora || '')));

}

function dzGaleria(l){
  const c = l.filter(a => (a.fotosAntes || []).length && (a.fotosDepois || []).length);
  const so = l.filter(a => (a.fotosAntes || []).length && !(a.fotosDepois || []).length).length;
  if (!c.length) return `<p class="dz-vazio">Ainda não há ações com foto de antes e de depois.${so ? ` ${plural(so, 'ação tem', 'ações têm')} foto de antes aguardando a de depois.` : ''}</p>`;
  return `<div class="dz-gal">${c.slice(0, 6).map(a => `<button class="dz-ba" data-paopen="${a.id}">

function dzTabela(l){

  const chave = {codigo:a => a.ordem || 0, prazo:a => a.prazo || '9999', status:a => ordSt[a.status], prioridade:a => ordPr[a.prioridade], resp:a => dzResp(a)};
  const f = chave[DZ.ord] || chave.codigo;
  const r = l.slice().sort((a, b) => { const x = f(a), y = f(b); return (x > y ? 1 : x < y ? -1 : 0) * DZ.dir; });
  const th = (k, t) => `<th><button data-dzord="${k}" aria-sort="${DZ.ord === k ? (DZ.dir > 0 ? 'ascending' : 'descending') : 'none'}">${t}${DZ.ord === k ? (DZ.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  if (!r.length) return `<p class="dz-vazio">Nenhuma ação com esses filtros.</p>`;
  const total = r.length, mostra = DZ.tudo ? r : r.slice(0, 12);

function dzOpcoes(l, fn, atual, rot){

/* dica flutuante + cruz no gráfico de evolução */
function dzTipEl(){ let t = $('#dzTip'); if (!t){ t = document.createElement('div'); t.id = 'dzTip'; t.setAttribute('role', 'tooltip'); document.body.appendChild(t); } return t; }
function dzMostra(txt, x, y){ const t = dzTipEl(); t.textContent = txt; t.style.display = 'block'; const w = t.offsetWidth; t.style.left = Math.min(innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px'; t.style.top = Math.max(8, y - t.offsetHeight - 12) + 'px'; }
function dzEsconde(){ const t = $('#dzTip'); if (t) t.style.display = 'none'; }
document.addEventListener('pointerover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (!el || !el.closest('.dz')) return; const r = el.getBoundingClientRect(); dzMostra(el.dataset.tip, r.left + r.width / 2, r.top); });
document.addEventListener('pointerout', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) dzEsconde(); });
addEventListener('scroll', dzEsconde, {passive:true});
function dzEvoInterativo(root){
  const svg = $('.dz-line', root), D = window._dzPts; if (!svg || !D) return;
  const hit = $('.dz-hit', svg), cr = $('.dz-cross', svg), cd = $('.dz-cdot', svg);
  const mover = e => {
    const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * D.W;
    let i = 0, best = 1e9; D.pts.forEach((p, k) => { const dd = Math.abs(D.X(k) - vx); if (dd < best){ best = dd; i = k; } });
    const p = D.pts[i], x = D.X(i), y = D.Y(p.v);
    cr.setAttribute('x1', x); cr.setAttribute('x2', x); cr.style.display = ''; cd.setAttribute('cx', x); cd.setAttribute('cy', y); cd.style.display = '';
    dzMostra(`${fmtData(p.d)}: ${p.v} de ${D.tot} concluídas (${D.tot ? Math.round(p.v / D.tot * 100) : 0}%)`, r.left + x / D.W * r.width, r.top + y / D.H * r.height);
  };
  hit.addEventListener('pointermove', mover); hit.addEventListener('pointerdown', mover);
  hit.addEventListener('pointerleave', () => { cr.style.display = 'none'; cd.style.display = 'none'; dzEsconde(); });
}

function dzFiltroTxt(){

  if (DZ.pr) t.push('Prioridade ' + PA_PR[DZ.pr].nome.toLowerCase());

  if (DZ.imp) t.push('Só impeditivas');
  if (DZ.q) t.push('Busca: ' + DZ.q);
  return t.join(' · ');
}

document.addEventListener('change', async e => {

  let pacote;
  try { pacote = JSON.parse(await f.text()); } catch { msg.textContent = 'Esse arquivo não é o pacote de dados.'; return; }
  if (!pacote || !pacote.dados){ msg.textContent = 'Esse arquivo não é o pacote de dados.'; return; }
  const n = Object.values(pacote.dados).reduce((a, m) => a + Object.keys(m || {}).length, 0);
  if (!(await confirmar(`Importar ${plural(n,'registro')} e ${plural(Object.keys(pacote.fotos || {}).length,'foto')}? O que tiver o mesmo código aqui será substituído.`))) return;
  try {
    const r = await nuvem.importar(pacote, t => { msg.textContent = t + '…'; });
    msg.textContent = `Pronto: ${plural(r.docs,'registro')} e ${plural(r.fotos,'foto')} importados.`;
    toast('Dados importados.');
  } catch (err){ console.error(err); msg.textContent = 'A importação parou (' + (err.code || 'erro') + '). Tente de novo: o que já foi não duplica.'; }
});

boot();
</script>
