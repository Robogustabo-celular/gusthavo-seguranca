<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="Acompanhe as ações, os prazos e as evidências em tempo real.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Segurança do Trabalho">
<meta property="og:title" content="Plano de Ação · Segurança do Trabalho">
<meta property="og:description" content="Acompanhe as ações, os prazos e as evidências em tempo real.">
<meta property="og:image" content="https://robogustabo-celular.github.io/gusthavo-seguranca/previa.jpg.jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://robogustabo-celular.github.io/gusthavo-seguranca/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0D385B">
<title>Segurança do Trabalho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#EDF0F2;--surface:#FFFFFF;--surface2:#F4F6F8;--ink:#1B2733;--muted:#5B6975;--line:#D6DDE2;
  --brand:#0D385B;--brand-ink:#FFFFFF;--hi:#F2B705;--accent:#F78300;--sky:#529ED0;
  --ok:#2E8B57;--notif:#C77F00;--interv:#1F6FB2;--interd:#C62F28;--dss:#0E8A86;--vencendo:#C77F00;
  --radius-lg:16px;--radius:10px;--radius-sm:6px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B;--surface:#16212A;--surface2:#1C2833;--ink:#E4EAEE;--muted:#93A2AD;--line:#2B3946;
    --brand:#7DB3E6;--brand-ink:#0E151B;
    --ok:#4FB77D;--notif:#E6A23C;--interv:#5AA2E0;--interd:#E8625B;--dss:#35B5B0;--vencendo:#E6A23C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B;--surface:#16212A;--surface2:#1C2833;--ink:#E4EAEE;--muted:#93A2AD;--line:#2B3946;
  --brand:#7DB3E6;--brand-ink:#0E151B;
  --ok:#4FB77D;--notif:#E6A23C;--interv:#5AA2E0;--interd:#E8625B;--dss:#35B5B0;--vencendo:#E6A23C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
h1,h2,h3{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-weight:600;margin:0;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* barra superior */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:12px;height:56px}
.top .logo{height:36px;max-width:140px;object-fit:contain;border-radius:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top .logo{background:#fff;padding:3px 6px}}
:root[data-theme="dark"] .top .logo{background:#fff;padding:3px 6px}
.top .area{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;line-height:1.2}
@media (max-width:430px){.top .area{display:none}}
.top .wm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;color:var(--brand);letter-spacing:.01em}
.top .gmlink{margin-left:auto;font-size:12px;font-weight:700;color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.top .gmlink + .who{margin-left:12px}
.login{display:grid;gap:10px;width:100%;max-width:320px;margin:18px auto 0;text-align:left}
.top .who{margin-left:auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.2}
.top .who b{display:block;color:var(--ink);font-size:13px;font-weight:600}

main{padding:18px 0 110px}

/* navegação inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:center;height:64px;padding:0 6px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand);font-weight:600}
.fab{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 10px;transform:translateY(-14px);box-shadow:0 4px 14px rgba(0,0,0,.18)}
.fab svg{width:28px;height:28px}

/* títulos de tela */
.head{margin:4px 0 16px}
.head h1{font-size:32px}
.head p{margin:2px 0 0;color:var(--muted)}

/* quadro de pendências: o elemento marcante */
.board{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-bottom:18px}
.pend{position:relative;overflow:hidden;border-radius:var(--radius-lg);padding:14px 14px 12px;border:0;text-align:left;background:var(--surface);color:var(--ink);min-height:112px;display:flex;flex-direction:column;justify-content:flex-end}
.pend .n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:48px;line-height:1}
.pend .l{display:block;font-size:14px;font-weight:600;margin-top:4px}
.pend .s{display:block;font-size:12px;color:var(--muted)}
.pend.venc{background:var(--interd);color:#fff}
.pend.venc .s{color:rgba(255,255,255,.85)}
.pend.venc.alert::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;background:repeating-linear-gradient(135deg,#1B2733 0 9px,var(--hi) 9px 18px)}
.pend.venc.zero{background:var(--surface);color:var(--ink)}
.pend.venc.zero .s{color:var(--muted)}
.pend.vcd .n{color:var(--vencendo)}
.pend.npz .n{color:var(--interv)}
@media (max-width:460px){.board{grid-template-columns:1fr 1fr}.pend.venc{grid-column:1/-1;min-height:96px;flex-direction:row;align-items:flex-end;justify-content:flex-start;gap:12px}.pend.venc .n{font-size:56px}}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}

.panel{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-top:14px}
.panel h2{font-size:20px;margin-bottom:12px}
.panel h2 small{font-family:"Barlow",sans-serif;font-weight:400;font-size:13px;color:var(--muted);margin-left:6px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin-top:14px}
.kpi{background:var(--surface);padding:12px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1;color:var(--c,var(--ink))}
.kpi span{font-size:13px;color:var(--muted)}

.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 34px;align-items:center;gap:10px;font-size:14px}
.bar .t{height:12px;background:var(--surface2);border-radius:3px;overflow:hidden;display:flex}
.bar .t i{display:block;height:100%}
.bar .v{text-align:right;font-weight:600}
@media (max-width:420px){.bar{grid-template-columns:104px 1fr 28px;font-size:13px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:140px}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col .stack{width:100%;max-width:30px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden;min-height:2px;background:var(--surface2)}
.col .stack i{display:block}
.col small{font-size:11px;color:var(--muted)}
.col b{font-size:12px}

/* itens de lista */
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--surface);border:1px solid transparent;border-radius:var(--radius);padding:12px;text-align:left;width:100%}
.item:hover{border-color:var(--line)}
.item .line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item strong{display:block;margin-top:6px;font-weight:600;line-height:1.25}
.item .meta{font-size:13px;color:var(--muted);margin-top:2px}
.thumb{width:62px;height:62px;border-radius:var(--radius-sm);background:var(--surface2);object-fit:cover}

.plate{--c:var(--brand);position:relative;display:inline-flex;align-items:center;background:var(--c);color:#fff;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.02em;padding:2px 8px;border-radius:4px;overflow:hidden;white-space:nowrap}
.plate.haz{padding-left:15px}
.plate.haz::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(135deg,#1B2733 0 4px,var(--hi) 4px 8px)}
.c-ok{--c:var(--ok)}.c-notif{--c:var(--notif)}.c-interv{--c:var(--interv)}.c-interd{--c:var(--interd)}.c-dss{--c:var(--dss)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.vencida{background:var(--interd);color:#fff}
.chip.vencendo{background:color-mix(in srgb,var(--vencendo) 18%,transparent);color:var(--vencendo)}
.chip.prazo,.chip.aberta{background:color-mix(in srgb,var(--interv) 14%,transparent);color:var(--interv)}
.chip.baixada,.chip.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.dss{background:color-mix(in srgb,var(--dss) 15%,transparent);color:var(--dss)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}

/* filtros */
.filters{display:grid;gap:10px;background:var(--surface);border-radius:var(--radius-lg);padding:14px;margin-bottom:12px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.resbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 2px 10px}
.resbar span{color:var(--muted);font-size:14px}

/* formulários */
label.f{display:grid;gap:5px;font-size:14px;font-weight:600}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;font-weight:400;font-size:16px;min-height:44px}
textarea{min-height:92px;resize:vertical}
.fsec{background:var(--surface);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;display:grid;gap:12px}
.fsec h3{font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.cats{grid-template-columns:repeat(2,1fr)}}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px;text-align:left;font-weight:600;font-size:14px;line-height:1.2;min-height:48px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--brand)}
.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.res{--c:var(--brand);border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 12px;text-align:left}
.res b{display:block;font-size:15px}
.res span{font-size:12px;color:var(--muted);line-height:1.25;display:block}
.res[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface))}
.res[aria-pressed="true"] b{color:var(--c)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:5px 11px;font-size:13px}
.checks{display:grid;gap:6px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.check small{color:var(--muted);display:block;font-size:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);font-size:22px}
.stepper input{text-align:center;font-weight:700;font-size:20px}

.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ph{background:var(--surface2);border-radius:var(--radius);overflow:hidden;position:relative}
.ph img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--line)}
.ph input{border:0;border-top:1px solid var(--line);border-radius:0;font-size:14px;min-height:40px}
.ph .rm{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:18px;line-height:1}
.addph{cursor:pointer;-webkit-tap-highlight-color:transparent;border:1.5px dashed var(--line);border-radius:var(--radius);background:none;aspect-ratio:1/1;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:10px}
.addph svg{width:28px;height:28px;margin:0 auto 4px}

.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px}
.btn.pri{background:var(--brand);color:var(--brand-ink)}
.btn.hi{background:var(--hi);color:#1B2733}
.btn.danger{background:none;color:var(--interd);border:1px solid color-mix(in srgb,var(--interd) 40%,transparent)}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.btn svg{width:18px;height:18px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* folha sobreposta */
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column}
#sheet.open{display:flex;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet.open{animation:none}}
.sh-head{background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.sh-head .wrap{display:flex;align-items:center;gap:10px;height:56px}
.sh-head h2{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.sh-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-body .wrap{padding-top:16px;padding-bottom:120px}
.sh-foot{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}

/* detalhe */
.dhero{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:12px}
.dhero .stripe{height:8px;background:var(--c)}
.dhero .stripe.haz{background:repeating-linear-gradient(135deg,#1B2733 0 9px,var(--c) 9px 18px)}
.dhero .in{padding:14px 16px}
.dhero h3{font-size:26px;margin-top:8px}
.dhero .msg{margin-top:8px;padding:10px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--ink);font-size:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden}
.kv div{background:var(--surface);padding:10px 12px}
.kv div.full{grid-column:1/-1}
.kv span{display:block;font-size:12px;color:var(--muted)}
.kv b{font-weight:600;white-space:pre-wrap;word-break:break-word}
.dsec{margin-top:14px}
.dsec h4{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:18px;margin:0 0 8px}
.txt{background:var(--surface);border-radius:var(--radius);padding:12px;white-space:pre-wrap;word-break:break-word}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gal figure{margin:0;background:var(--surface);border-radius:var(--radius);overflow:hidden}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--surface2)}
.gal figcaption{font-size:13px;padding:6px 9px;color:var(--muted)}
.gal.one{grid-template-columns:1fr}
.gal.one img{aspect-ratio:4/3;object-fit:contain}

.pill-mode{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pill-mode i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.pill-mode.local i{background:var(--vencendo)}
.tlist{display:grid;gap:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.trow small{display:block;color:var(--muted)}
.logo-prev{height:72px;max-width:240px;object-fit:contain;background:#fff;border-radius:8px;padding:8px;border:1px solid var(--line)}
.logos{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1B2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;max-width:90vw;display:none}
#toast.on{display:block}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.optrow{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.optrow input{width:22px;height:22px;accent-color:var(--brand)}
.ppg{margin-top:4px}
.ppg h4{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;margin:12px 0 6px;color:var(--brand)}
.ppi{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px;font-size:14px;line-height:1.25}
.ppi.nc{border-color:var(--interd);background:color-mix(in srgb,var(--interd) 8%,transparent)}
.ppi .obs{grid-column:1/-1;margin-top:2px}
.ppb{display:flex;gap:4px}
.ppb button{width:42px;height:38px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--muted);padding:0}
.ppb button[data-v="C"][aria-pressed="true"]{border-color:var(--ok);background:var(--ok);color:#fff}
.ppb button[data-v="NC"][aria-pressed="true"]{border-color:var(--interd);background:var(--interd);color:#fff}
.ppb button[data-v="NA"][aria-pressed="true"]{border-color:var(--muted);background:var(--muted);color:#fff}
.ppresumo{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;font-weight:600;position:sticky;top:0;background:var(--surface);padding:6px 0;z-index:2}
.ppresumo span{padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.ppresumo span.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.ppresumo span.nc{background:color-mix(in srgb,var(--interd) 15%,transparent);color:var(--interd)}
.ppresumo span.falta{background:color-mix(in srgb,var(--notif) 18%,transparent);color:var(--notif)}
.taxa{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.ring{width:104px;height:104px;flex:0 0 104px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--rc,var(--ok)) calc(var(--p,0)*1%),var(--surface2) 0)}
.ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--surface)}

.pill.s-ok,.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}

.pa-up{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.pa-link{display:flex;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);width:100%;text-align:left}

<script>/* Nuvem Concremat (Firebase): banco em tempo real, fotos e login.
   Mantém a mesma interface que o app já usava (db, assets, downloads, user). */
(function(){
  const CFG = {"apiKey":"AIzaSyBr5RUesMJBhKWOepHI6QK-PkXIIMctXeU","authDomain":"seguranca-concremat.firebaseapp.com","projectId":"seguranca-concremat","storageBucket":"seguranca-concremat.firebasestorage.app","messagingSenderId":"448785550205","appId":"1:448785550205:web:3e0b78fdef40581e8b1a14"};
  const DONO = 'robogustabo@gmail.com';
  const PUBLICAS = new Set(['planos', 'planoAcoes', 'config', 'gm']);
  const DICA = 'concremat.logado';

  if (!window.firebase){
    const msg = 'Não foi possível carregar o banco de dados. Abra o sistema pelo link do site (github.io) e confira a internet.';
    const falha = () => Promise.reject(Object.assign(new Error('sem-firebase'), {code:'sem-firebase'}));
    window.nuvem = { logado: () => false, pronto: Promise.resolve(null), entrar: falha, sair(){}, conferir: async () => false, foto: async () => '', importar: falha };
    window.claude = { use: async () => null };
    document.addEventListener('DOMContentLoaded', () => { const b = document.createElement('div'); b.textContent = msg; b.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#8A1F11;color:#fff;font:600 14px Barlow,system-ui,sans-serif;padding:12px 14px;border-radius:12px;text-align:center'; document.body.appendChild(b); });
    return;
  }
  firebase.initializeApp(CFG);
  const fs = firebase.firestore();
  const auth = firebase.auth();

  let usuario = null, resolvido = false;
  const dica = () => { try { return localStorage.getItem(DICA) === '1'; } catch { return false; } };
  const pronto = new Promise(res => {
    auth.onAuthStateChanged(u => {
      const antes = resolvido ? !!usuario : dica();
      usuario = u; resolvido = true;
      try { u ? localStorage.setItem(DICA, '1') : localStorage.removeItem(DICA); } catch {}
      res(u);
      if (antes !== !!u && document.readyState !== 'loading' && window.render) { try { window.render(); } catch {} }
    });
  });
  const logado = () => resolvido ? !!usuario : dica();

  /* ---------- banco ---------- */
  const limpo = o => JSON.parse(JSON.stringify(o));
  const vazioCol = () => ({docs:[], empty:true, size:0});
  function docRef(c, id){
    const r = fs.collection(c).doc(id);
    return {
      id,
      onSnapshot(fn, err){
        if (!logado() && !PUBLICAS.has(c)){ setTimeout(() => fn({id, exists:false, data:() => undefined, metadata:{hasPendingWrites:false}}), 0); return () => {}; }
        return r.onSnapshot(fn, e => { console.error(c, e); err && err(e); });
      },
      get: () => r.get(),
      set: d => r.set(limpo(d)),
      update: d => r.update(limpo(d)),
      delete: () => r.delete(),
    };
  }
  const db = {
    collection(c){
      return {
        doc: id => docRef(c, id),
        onSnapshot(fn, err){
          if (!logado() && !PUBLICAS.has(c)){ setTimeout(() => fn(vazioCol()), 0); return () => {}; }
          return fs.collection(c).onSnapshot(fn, e => { console.error(c, e); err && err(e); });
        },
      };
    },
    doc(p){ const [c, id] = String(p).split('/'); return docRef(c, id); },
  };

  /* ---------- fotos (guardadas no próprio banco) ---------- */
  const LIMITE = 680000; // cada documento do Firestore aceita até 1 MB
  const paraDataURL = b => new Promise((ok, err) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = err; f.readAsDataURL(b); });
  async function reduzir(blob){
    if (blob.size <= LIMITE) return blob;
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = url; });
      let lado = 1400, q = 0.78, out = blob;
      while (out.size > LIMITE && lado >= 600){
        const s = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
        const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.drawImage(img, 0, 0, cv.width, cv.height);
        out = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
        lado = Math.round(lado * 0.82); q = Math.max(0.55, q - 0.06);
      }
      return out;
    } finally { URL.revokeObjectURL(url); }
  }
  const novoId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
  const cacheFoto = new Map();
  const assets = {
    async upload(blob){
      const d = await paraDataURL(await reduzir(blob));
      const id = novoId();
      await fs.collection('fotoBin').doc(id).set({d, em: Date.now()});
      cacheFoto.set(id, d);
      return {id};
    },
    async delete(id){ try { await fs.collection('fotoBin').doc(id).delete(); } catch {} cacheFoto.delete(id); },
  };
  async function foto(id){
    if (cacheFoto.has(id)) return cacheFoto.get(id);
    const p = fs.collection('fotoBin').doc(id).get().then(s => { const d = s.exists ? s.data().d : ''; if (!d) cacheFoto.delete(id); return d; });
    cacheFoto.set(id, p);
    const d = await p; if (d) cacheFoto.set(id, d); return d;
  }

  /* ---------- arquivos ---------- */
  const downloads = {
    async save({filename, data}){
      const blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/i.test(filename) ? 'application/json' : 'application/octet-stream'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      return {status:'saved'};
    }
  };

  /* ---------- sessão ---------- */
  const user = { isOwner: () => logado(), canEdit: () => logado() };
  const traduz = e => { const c = (e && e.code) || ''; const x = new Error(c); x.code = /invalid-credential|wrong-password|user-not-found|invalid-login/.test(c) ? 'senha-incorreta' : /too-many/.test(c) ? 'muitas-tentativas' : /network/.test(c) ? 'sem-internet' : c || 'erro'; return x; };
  window.nuvem = {
    logado,
    pronto,
    async entrar(senha){
      try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword(DONO, senha); try { localStorage.setItem(DICA, '1'); } catch {} return true; }
      catch (e) { throw traduz(e); }
    },
    async sair(){ try { await auth.signOut(); } catch {} try { localStorage.removeItem(DICA); } catch {} location.reload(); },
    async conferir(){ await pronto; return !!usuario; },
    foto,
    async importar(pacote, progresso){
      const dados = pacote.dados || {}, fotos = pacote.fotos || {};
      const ids = Object.keys(fotos);
      for (let i = 0; i < ids.length; i += 6){
        const lote = fs.batch();
        ids.slice(i, i + 6).forEach(id => lote.set(fs.collection('fotoBin').doc(id), {d: fotos[id], em: Date.now()}));
        await lote.commit();
        progresso && progresso(`Fotos ${Math.min(i + 6, ids.length)} de ${ids.length}`);
      }
      const docs = [];
      Object.entries(dados).forEach(([c, m]) => Object.entries(m || {}).forEach(([id, d]) => docs.push([c, id, d])));
      for (let i = 0; i < docs.length; i += 100){
        const lote = fs.batch();
        docs.slice(i, i + 100).forEach(([c, id, d]) => lote.set(fs.collection(c).doc(id), limpo(d)));
        await lote.commit();
        progresso && progresso(`Registros ${Math.min(i + 100, docs.length)} de ${docs.length}`);
      }
      return {fotos: ids.length, docs: docs.length};
    },
  };

  window.claude = { use: async (n) => { await pronto; return ({db, assets, downloads, user})[n] || null; } };
})();
</script>
<script>
"use strict";
/* ================= utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hojeISO = () => iso(new Date());
const agoraHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseISO = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, m-1, d); };
const fmtData = s => s ? String(s).split('-').reverse().join('/') : '-';
const fmtCurta = s => s ? String(s).slice(8,10) + '/' + String(s).slice(5,7) : '-';
const addDias = (s, n) => { const d = parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDias = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtDH = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const plural = (n, s, p) => `${n} ${n === 1 ? s : (p || s + 's')}`;

function confirmar(msg){
  return new Promise(res => {
    const h = document.createElement('div');
    h.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(8,20,32,.6);display:grid;place-items:center;padding:16px';
    h.innerHTML = `<div style="background:var(--surface);color:var(--ink);border-radius:16px;padding:18px;max-width:380px;width:100%;display:grid;gap:14px"><p style="margin:0;font-size:16px">${esc(msg)}</p><div class="actions" style="margin:0"><button class="btn" data-c="0">Cancelar</button><button class="btn pri" data-c="1">Confirmar</button></div></div>`;
    h.addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; e.stopPropagation(); h.remove(); res(b.dataset.c === '1'); });
    document.body.appendChild(h);
    h.querySelector('[data-c="1"]').focus();
  });
}
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); }

  const ck = (eq && eq.checklist) || {};

  for (const g of itensDe((eq && eq.cat) || 'pre_partida', eq && eq.sub)) for (const i of g.itens){

  return {ok, nc, na, total, faltam};
}

function situacao(r){
  if (r.tipo === 'dss') return {k:'dss', t: r.modalidade === 'pausa' ? 'Pausa de segurança' : 'DSS'};
  if (r.resultado === 'conforme') return {k:'ok', t:'Conforme'};
  if (r.status === 'baixada') return {k:'baixada', t:'Baixada'};
  if (!r.prazo) return {k:'aberta', t:'Em aberto'};
  const d = diffDias(r.prazo, hojeISO());
  if (d < 0) return {k:'vencida', t:`Vencida há ${plural(-d,'dia')}`};

function localLoad(){

function localSave(){
  try { localStorage.setItem(LKEY, JSON.stringify({reg:S.reg, cfg:S.cfg})); return true; }
  catch { toast('Sem espaço neste aparelho. Exclua fotos antigas ou exporte um backup.'); return false; }
}
function startLocal(){ S.mode = 'local'; localLoad(); S.loaded = true; render(); }

async function boot(){
  render();
  if (!window.claude || typeof window.claude.use !== 'function'){ startLocal(); return; }
  let db = null, assets = null, dl = null, user = null;
  try { [db, assets, dl, user] = await Promise.all([claude.use('db'), claude.use('assets'), claude.use('downloads'), claude.use('user')]); } catch {}
  S.dl = dl; S.assets = assets; S.user = user; S.userOk = true;
  if (!db){ startLocal(); return; }
  S.db = db; S.mode = 'db';
  db.collection('registros').onSnapshot(snap => {
    S.reg = snap.docs.map(d => Object.assign({id:d.id}, clone(d.data())));
    S.loaded = true; render(); refreshSheet();
  }, e => { toast('Não foi possível carregar os registros (' + e.code + '). Recarregue a página.'); });
  db.doc('config/geral').onSnapshot(s => { S.cfg = s.exists ? clone(s.data()) : null; render(); }, () => {});
  db.collection('planos').onSnapshot(sn => { PA.planos = sn.docs.map(d => Object.assign({id:d.id}, clone(d.data()))); PA.okP = true; render(); refreshSheet(); }, () => { PA.okP = true; render(); });
  db.collection('planoAcoes').onSnapshot(sn => { PA.acoes = sn.docs.map(d => Object.assign({id:d.id}, clone(d.data()))); PA.okA = true; render(); refreshSheet(); }, () => { PA.okA = true; render(); });
  render();
}

async function salvarReg(r){
  const body = clone(r); delete body.id;
  if (S.mode === 'db'){ await S.db.collection('registros').doc(r.id).set(body); }
  else {
    const i = S.reg.findIndex(x => x.id === r.id);
    const antes = clone(S.reg);
    if (i >= 0) S.reg[i] = clone(r); else S.reg.push(clone(r));
    if (!localSave()){ S.reg = antes; throw new Error('espaço'); }
    render(); refreshSheet();
  }
}
async function apagarReg(r){
  if (S.mode === 'db') await S.db.collection('registros').doc(r.id).delete();
  else { S.reg = S.reg.filter(x => x.id !== r.id); localSave(); render(); }
  const refs = [...(r.fotos||[]), ...((r.baixa && r.baixa.fotos) || [])].map(f => f.ref);
  for (const ref of refs) if (!paFotoUsada(ref)) apagarFoto(ref);
}
async function salvarCfg(novo){
  S.cfg = clone(novo);
  if (S.mode === 'db') await S.db.doc('config/geral').set(clone(novo));
  else localSave();
  render();
}

function carregarImg(src){
  return new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => err(new Error('imagem')); i.src = src; });
}
async function redimensionar(file, max, q, saida, tipo = 'image/jpeg'){
  const url = URL.createObjectURL(file);
  try {
    const img = await carregarImg(url);
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
    const x = c.getContext('2d');
    if (tipo === 'image/jpeg'){ x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
    x.drawImage(img, 0, 0, c.width, c.height);
    if (saida === 'data') return c.toDataURL(tipo, q);
    return await new Promise(res => c.toBlob(res, tipo, q));
  } finally { URL.revokeObjectURL(url); }
}
async function guardarFoto(file){
  if (S.mode === 'db' && S.assets){
    const blob = await redimensionar(file, 1600, 0.82, 'blob');
    const res = await S.assets.upload(blob, {type:'image/jpeg'});
    return {k:'a', id:res.id};
  }
  let dim = 1200, q = 0.78;
  let data = await redimensionar(file, dim, q, 'data');
  while (data.length > 230000 && dim > 500){ dim = Math.round(dim * 0.85); q = Math.max(0.5, q - 0.06); data = await redimensionar(file, dim, q, 'data'); }
  if (S.mode === 'db'){ const id = uid(); await S.db.doc('fotos/' + id).set({data}); return {k:'d', id}; }
  return {k:'u', data};
}
async function fotoSrc(ref){
  if (!ref) throw new Error('sem foto');
  if (ref.k === 'a') return await nuvem.foto(ref.id);
  if (ref.k === 'u') return ref.data;
  if (ref.k === 'd'){
    if (S.fotoCache.has(ref.id)) return S.fotoCache.get(ref.id);
    const s = await S.db.doc('fotos/' + ref.id).get();
    const d = s.exists ? s.data().data : '';
    if (d) S.fotoCache.set(ref.id, d);
    return d;
  }
  throw new Error('ref');
}
async function apagarFoto(ref){
  try {
    if (ref.k === 'a' && S.assets) await S.assets.delete(ref.id);
    else if (ref.k === 'd' && S.db) await S.db.doc('fotos/' + ref.id).delete();
  } catch {}
}
function hidratar(root){
  $$('img[data-ref]', root).forEach(async img => {
    try { const ref = JSON.parse(img.dataset.ref); img.removeAttribute('data-ref'); img.src = await fotoSrc(ref); } catch {}
  });
}
const imgRef = (ref, cls = '', alt = '') => `<img class="${cls}" alt="${esc(alt)}" data-ref='${esc(JSON.stringify(ref))}'>`;

/* ================= filtros ================= */
const UI = { tab:'painel', per:'7', f:{per:'mes', de:hojeISO(), ate:hojeISO(), res:'todos', cat:'todas', sit:'todas', q:'', base:'registro'} };
function periodoAnterior(f){
  const [de, ate] = intervalo(f);
  if (!de || !ate) return null;
  const n = diffDias(ate, de) + 1;
  return Object.assign({}, f, {per:'custom', de:addDias(de, -n), ate:addDias(de, -1)});
}
function metricas(lista){
  const insp = lista.filter(r => r.tipo !== 'dss');
  const nc = insp.filter(r => r.resultado !== 'conforme');
  const baixadas = nc.filter(r => r.status === 'baixada' && r.baixa);
  const noPrazo = baixadas.filter(r => !r.prazo || r.baixa.data <= r.prazo);
  const dias = baixadas.map(r => Math.max(0, diffDias(r.baixa.data, r.data)));
  const pend = nc.filter(pendente);
  const porTipo = {};
  for (const k of ['notificacao','intervencao','interdicao']){
    const g = nc.filter(r => r.resultado === k);
    porTipo[k] = {total:g.length, baixadas:g.filter(r => r.status === 'baixada').length};
  }
  return {
    insp:insp.length, conformes:insp.filter(r => r.resultado === 'conforme').length,
    nc:nc.length, baixadas:baixadas.length, pend:pend.length,
    vencidas:pend.filter(r => situacao(r).k === 'vencida').length,
    taxa: nc.length ? baixadas.length / nc.length * 100 : 0,
    prazoOk: baixadas.length ? noPrazo.length / baixadas.length * 100 : 0,
    media: dias.length ? dias.reduce((a, b) => a + b, 0) / dias.length : null,
    porTipo, lista:baixadas.slice().sort((a, b) => (a.baixa.data).localeCompare(b.baixa.data)),
    dss:lista.filter(r => r.tipo === 'dss').length,
  };
}
const fotoAntes = r => (r.fotos && r.fotos[0]) || (r.categoria === 'pre_partida' ? ppLista(r).map(eq => (eq.fotos || [])[0]).filter(Boolean)[0] : null) || null;
function intervalo(f){
  const h = hojeISO(), d = new Date();
  switch (f.per){
    case 'hoje': return [h, h];
    case 'semana': { const dow = (d.getDay() + 6) % 7; const ini = new Date(d); ini.setDate(d.getDate() - dow); const fim = new Date(ini); fim.setDate(ini.getDate() + 6); return [iso(ini), iso(fim)]; }
    case 'mes': { const ini = new Date(d.getFullYear(), d.getMonth(), 1); const fim = new Date(d.getFullYear(), d.getMonth()+1, 0); return [iso(ini), iso(fim)]; }
    case 'dia': return [f.de, f.de];
    case 'custom': return [f.de || '', f.ate || ''];
    default: return ['', ''];
  }
}
function filtrar(f){
  const [de, ate] = intervalo(f);
  const q = (f.q || '').trim().toLowerCase();
  const porBaixa = f.base === 'baixa';
  return S.reg.filter(r => {
    const dt = porBaixa ? (r.status === 'baixada' && r.baixa ? r.baixa.data : null) : r.data;
    if (porBaixa && !dt) return false;
    if (de && dt < de) return false;
    if (ate && dt > ate) return false;
    if (f.res !== 'todos'){
      if (f.res === 'dss'){ if (r.tipo !== 'dss') return false; }
      else if (r.tipo === 'dss' || r.resultado !== f.res) return false;
    }
    if (f.cat !== 'todas' && (r.tipo === 'dss' || r.categoria !== f.cat)) return false;
    if (f.sit !== 'todas'){
      const k = situacao(r).k;
      if (f.sit === 'abertas'){ if (!pendente(r)) return false; }
      else if (f.sit !== k) return false;
    }
    if (q){
      const hay = [r.numero, r.tag, r.equipamento, r.local, r.assunto, r.descricao, r.subtipo, r.motivo, r.notificado && r.notificado.nome, r.notificado && r.notificado.empresa].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }).sort((a, b) => (b.data + b.hora).localeCompare(a.data + a.hora));
}
function descFiltro(f){
  const [de, ate] = intervalo(f);
  const partes = [];
  if (f.per === 'tudo' || (!de && !ate)) partes.push('Período: todos os registros');
  else if (de === ate) partes.push('Data: ' + fmtData(de));
  else partes.push(`Período: ${de ? fmtData(de) : 'início'} a ${ate ? fmtData(ate) : 'hoje'}`);
  if (f.res !== 'todos') partes.push('Registro: ' + (f.res === 'dss' ? 'DSS e pausas' : RES[f.res].plural));
  if (f.cat !== 'todas') partes.push('Inspeção: ' + CATS[f.cat].nome);
  const sits = {abertas:'Pendentes',vencida:'Vencidas',vencendo:'Vencendo',prazo:'No prazo',baixada:'Baixadas'};
  if (f.sit !== 'todas') partes.push('Situação: ' + sits[f.sit]);
  if (f.q) partes.push('Busca: ' + f.q);
  if (f.base === 'baixa') partes.push('Contado pela data da baixa');
  return partes.join(' | ');
}

    ${[['hoje','Hoje'],['7','7 dias'],['30','30 dias'],['tudo','Tudo']].map(([k,l]) => `<button data-per="${k}" aria-pressed="${UI.per===k}">${l}</button>`).join('')}
  </div>

  <div class="kpis">
    <div class="kpi"><b>${insp.length}</b><span>Inspeções</span></div>
    <div class="kpi" style="--c:var(--notif)"><b>${cnt('notificacao')}</b><span>Notificações</span></div>
    <div class="kpi" style="--c:var(--interv)"><b>${cnt('intervencao')}</b><span>Intervenções</span></div>

    <div class="kpi" style="--c:var(--dss)"><b>${dss.length}</b><span>DSS e pausas (${plural(participantes,'pessoa')})</span></div>

  </div>

  ${(() => {

    const delta = ant && ant.nc ? m.taxa - ant.taxa : null;

        <small>${dn[parseISO(x.d).getDay()]}</small></div>`).join('')}</div>

const icoPDF = () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M12 18v-6M9 15l3 3 3-3"/></svg>`;

/* ================= folha (sheet) ================= */
let SHEET = null;
function abrirSheet(tipo, titulo, corpo, rodape, extra = ''){
  const mesmo = SHEET && SHEET.tipo === tipo && SHEET.aberto === tipo;
  SHEET = SHEET && SHEET.tipo === tipo ? SHEET : {tipo};
  SHEET.aberto = tipo;
  $('#shTitle').textContent = titulo;
  $('#shExtra').innerHTML = extra;
  const body = $('#shBody');
  const top = body.scrollTop;
  body.innerHTML = `<div class="wrap">${corpo}</div>`;
  const foot = $('#shFoot');
  if (rodape){ foot.hidden = false; foot.innerHTML = `<div class="wrap">${rodape}</div>`; } else { foot.hidden = true; foot.innerHTML = ''; }
  const sh = $('#sheet');
  if (!sh.classList.contains('open')){ sh.classList.add('open'); body.scrollTop = 0; document.body.style.overflow = 'hidden'; }
  else body.scrollTop = mesmo ? top : 0;
  hidratar(body);
}
function fecharSheet(){
  $('#sheet').classList.remove('open'); document.body.style.overflow = '';
  if (F) todasFotosF().forEach(p => p.file && p.url && URL.revokeObjectURL(p.url));
  SHEET = null; F = null;
}
function refreshSheet(){ if (SHEET && SHEET.tipo === 'detalhe') abrirDetalhe(SHEET.id, true); else if (SHEET && SHEET.tipo === 'padet') paDetalhe(SHEET.id, true); }

function kv(itens){ return `<div class="kv">${itens.filter(Boolean).map(([l, v, full]) => `<div class="${full ? 'full' : ''}"><span>${esc(l)}</span><b>${esc(v || '-')}</b></div>`).join('')}</div>`; }
function galeria(fotos){
  if (!fotos || !fotos.length) return '';
  return `<div class="gal ${fotos.length === 1 ? 'one' : ''}">${fotos.map((f, i) => `<figure>${imgRef(f.ref, '', f.legenda || 'Foto ' + (i+1))}<figcaption>${esc(f.legenda || 'Foto ' + (i+1))}</figcaption></figure>`).join('')}</div>`;
}
function mensagem(r){
  const s = situacao(r);
  if (r.tipo === 'dss') return '';
  if (r.resultado === 'conforme') return 'Inspeção conforme. Nenhuma irregularidade encontrada.';
  if (r.status === 'baixada'){
    const noPrazo = !r.prazo || r.baixa.data <= r.prazo;
    return `Baixada em ${fmtData(r.baixa.data)} às ${r.baixa.hora}, ${noPrazo ? 'dentro do prazo' : 'fora do prazo'}.`;
  }
  if (r.resultado === 'interdicao') return `Interditado até a liberação pela Segurança do Trabalho. ${s.t}.`;
  if (r.resultado === 'intervencao') return `Atividade paralisada para correção imediata. ${s.t}.`;
  return `O notificado deve se adequar até ${fmtData(r.prazo)}. ${s.t}.`;
}
function abrirDetalhe(id, silencioso){
  const r = S.reg.find(x => x.id === id);

  SHEET = {tipo:'detalhe', id, aberto: SHEET && SHEET.tipo === 'detalhe' && SHEET.id === id ? 'detalhe' : null};
  const s = situacao(r);

  const cat = dss ? null : CATS[r.categoria];
  let corpo = `<div class="dhero ${corClasse(r)}" style="--c:var(--${dss ? 'dss' : R.cor})">

    <h3>${esc(dss ? (r.modalidade === 'pausa' ? 'Pausa de segurança' : 'DSS') + ': ' + (r.assunto || '') : R.doc)}</h3>

  if (dss){
    corpo += kv([['Data e horário', `${fmtData(r.data)} às ${r.hora}`],['Participantes', plural(+r.participantes||0,'pessoa')],['Local', r.local],['Conduzido por', nomesInsp(r)]]);
    if (r.descricao) corpo += `<section class="dsec"><h4>Resumo do que foi abordado</h4><div class="txt">${esc(r.descricao)}</div></section>`;
  } else {
    corpo += kv([['Inspeção', cat.nome],[cat.sub, r.subtipo],['TAG / identificação', r.tag], cat.equip ? [cat.equipLabel, r.equipamento] : null, r.operador ? ['Operador', r.operador] : null, r.horimetro ? ['Horímetro / KM', r.horimetro] : null, r.turno ? ['Turno', r.turno] : null,['Local / área', r.local],['Data e horário', `${fmtData(r.data)} às ${r.hora}`],['Técnico(s)', nomesInsp(r), true]]);
    if (r.resultado !== 'conforme'){
      const n = r.notificado || {};
      corpo += `<section class="dsec"><h4>${r.resultado === 'interdicao' ? 'Responsável pela área / equipamento' : 'Notificado'}</h4>${kv([['Nome', n.nome],['Função', n.funcao],['Empresa / setor', n.empresa, true],[R.prazoLabel, r.prazo ? fmtData(r.prazo) : 'Sem prazo']])}</section>`;
    }

      corpo += `<section class="dsec"><h4>Colaborador e treinamentos</h4>${kv([['Colaborador', r.colaborador],['Função', r.funcao],['Pessoas na atividade', r.equipe ? String(r.equipe) : '-'],['Treinamentos', [...(r.treinamentos || []), r.treinoObs].filter(Boolean).join(', '), true]])}</section>`;
    }
    if (r.categoria !== 'pre_partida' && CHECKS[r.categoria] && Object.keys(r.checklist || {}).length){
      const un = unidadeReg(r), ncs = ppNaoConformes(un);

      </section>`;

    if (r.categoria === 'pre_partida'){

          ${eq.operador || eq.horimetro || eq.modelo ? `<p class="muted" style="margin:0 0 6px;font-size:14px">${[eq.modelo, eq.operador ? 'Operador: ' + eq.operador : '', eq.horimetro ? 'Horímetro/KM: ' + eq.horimetro : ''].filter(Boolean).map(esc).join(' / ')}</p>` : ''}
          <div class="ppresumo" style="position:static">${resumoHTML(eq)}</div>

    const bloco = (t, x, cor) => x ? `<section class="dsec"><h4>${t}</h4><div class="txt" style="border-left:4px solid var(--${cor})">${esc(x)}</div></section>` : '';
    if (r.resultado === 'conforme') corpo += bloco('O que está conforme', r.conformidades || 'Todos os itens verificados estão em conformidade.', 'ok');
    else corpo += bloco('Irregularidade constatada', r.motivo, R.cor) + bloco('Tratativa', r.recomendacoes, 'interv');

  }
  if (r.fotos && r.fotos.length) corpo += `<section class="dsec"><h4>Fotos</h4>${galeria(r.fotos)}</section>`;
  if (r.status === 'baixada' && r.baixa){
    corpo += `<section class="dsec"><h4>Baixa e evidências</h4>${kv([['Data da baixa', `${fmtData(r.baixa.data)} às ${r.baixa.hora}`],['Baixado por', r.baixa.por],['Ação corretiva realizada', r.baixa.obs, true]])}</section>`;

  corpo += `<div class="actions" style="margin-top:18px">
    <button class="btn" data-act="editar" data-id="${r.id}">Editar</button>

  const rodape = `<div class="actions" style="margin:0">
    <button class="btn ${pendente(r) ? '' : 'pri'}" data-act="pdf" data-id="${r.id}" ${pendente(r) ? '' : 'style="grid-column:1/-1"'}>${icoPDF()} Gerar PDF</button>

  abrirSheet('detalhe', r.numero, corpo, rodape);
}

async function salvarForm(btn){
  const f = F;
  const erro = m => { toast(m); return false; };
  if (f.tipo === 'dss'){
    if (!f.assunto.trim()) return erro('Informe o assunto do diálogo.');
    if (!(+f.participantes > 0)) return erro('Informe quantas pessoas participaram.');
  } else {
    if (!f.categoria) return erro('Escolha o tipo de inspeção.');
    if (f.categoria === 'pre_partida'){
      for (const eq of f.ppEquip){
        if (!eq.sub) return erro('Escolha o equipamento em cada bloco da pré-partida.');
        const res = ppResumo(eq);
        if (res.faltam) return erro(`Faltam ${plural(res.faltam,'item','itens')} no checklist de ${nomeEquip(eq)}.`);
      }
      const tot = ppTotais({ppEquip:f.ppEquip});
      if (tot.nc && f.resultado === 'conforme') return erro('Há itens não conformes. Escolha notificação, intervenção ou interdição.');
      if (tot.nc && !f.motivo.trim()) f.motivo = textoNC({ppEquip:f.ppEquip});
    } else if (CHECKS[f.categoria]){
      const un = {cat:f.categoria, sub:f.subtipo, checklist:f.checklist};
      const res = ppResumo(un);
      if (res.nc && f.resultado === 'conforme') return erro('Há itens não conformes no checklist. Escolha notificação, intervenção ou interdição.');
      if (res.nc && !f.motivo.trim()) f.motivo = ppNaoConformes(un).map(i => `- ${i.t}${i.obs ? ': ' + i.obs : ''}`).join('\n');
    }
    if (f.resultado !== 'conforme'){
      if (!f.notificado.nome.trim()) return erro('Informe o nome de quem está sendo notificado.');
      if (!f.motivo.trim()) return erro('Descreva a irregularidade constatada.');
      if (!f.recomendacoes.trim()) return erro('Descreva a tratativa: o que precisa ser feito.');
      if (f.resultado === 'notificacao' && !f.prazo) return erro('Defina o prazo para adequação.');
    }
  }
  if (!f.data || !f.hora) return erro('Informe data e horário.');
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    const subir = async lista => {
      const out = [];
      for (const p of (lista || [])) out.push({ref: p.ref || await guardarFoto(p.file), legenda:p.legenda || ''});
      return out;
    };
    const fotos = await subir(f.fotos);
    const pp = f.tipo !== 'dss' && f.categoria === 'pre_partida';
    let ppEquip = null;
    if (pp){
      ppEquip = [];
      for (const eq of f.ppEquip) ppEquip.push({id:eq.id, sub:eq.sub, tag:(eq.tag || '').trim(), modelo:(eq.modelo || '').trim(), operador:(eq.operador || '').trim(), horimetro:(eq.horimetro || '').trim(), checklist:clone(eq.checklist || {}), fotos: await subir(eq.fotos)});
    }
    const antigo = S.reg.find(x => x.id === f.id);
    const pref = f.tipo === 'dss' ? (f.modalidade === 'pausa' ? 'PS' : 'DSS') : (f.categoria === 'pre_partida' && f.resultado === 'conforme' ? 'PP' : RES[f.resultado].pref);
    let numero = antigo && antigo.numero && antigo.numero.startsWith(pref + '-') ? antigo.numero : proximoNumero(pref);
    const c = cfg();
    const snap = f.inspetores.map(id => (c.inspetores||[]).find(i => i.id === id)).filter(Boolean).map(i => ({nome:i.nome, cargo:i.cargo, setor:i.setor||''}));
    const base = {id:f.id, numero, tipo:f.tipo, data:f.data, hora:f.hora, local:f.local.trim(), descricao:f.descricao.trim(), fotos, inspetores:f.inspetores, inspetoresSnap:snap,
      criadoEm: antigo ? antigo.criadoEm : new Date().toISOString(), atualizadoEm:new Date().toISOString()};
    let r;
    if (f.tipo === 'dss'){
      r = Object.assign(base, {modalidade:f.modalidade, assunto:f.assunto.trim(), participantes:+f.participantes});
    } else {
      const conf = f.resultado === 'conforme';
      const un = pp && ppEquip.length === 1 ? ppEquip[0] : null;
      r = Object.assign(base, {categoria:f.categoria,
        subtipo: pp ? (un ? un.sub : plural(ppEquip.length, 'equipamento')) : (f.subtipo === 'Outro' ? (f.subOutro.trim() || 'Outro') : f.subtipo),
        tag: pp ? (un ? un.tag : '') : f.tag.trim(),
        equipamento: pp ? (un ? un.modelo : '') : (CATS[f.categoria].equip ? f.equipamento.trim() : ''),
        resultado:f.resultado, planoId: f.resultado === 'conforme' ? '' : (f.planoId || ''),
        notificado: conf ? null : {nome:f.notificado.nome.trim(), funcao:f.notificado.funcao.trim(), empresa:f.notificado.empresa.trim()},
        motivo: conf ? '' : f.motivo.trim(), recomendacoes: conf ? '' : f.recomendacoes.trim(), prazo: conf ? '' : f.prazo,
        conformidades: conf ? f.conformidades.trim() : '', melhorias: f.melhorias.trim(),
        operador: pp && un ? un.operador : '', horimetro: pp && un ? un.horimetro : '', turno:f.turno || '',
        checklist: pp ? (un ? un.checklist : null) : (CHECKS[f.categoria] ? clone(f.checklist) : null), ppEquip,
        colaborador: f.categoria === 'atividade' ? (f.colaborador || '').trim() : '',
        funcao: f.categoria === 'atividade' ? (f.funcao || '').trim() : '',
        equipe: f.categoria === 'atividade' ? (+f.equipe || 1) : null,
        treinamentos: f.categoria === 'atividade' ? clone(f.treinamentos || []) : null,
        treinoObs: f.categoria === 'atividade' ? (f.treinoObs || '').trim() : '',
        status: conf ? 'conforme' : (antigo && antigo.status === 'baixada' ? 'baixada' : 'aberta'),
        baixa: conf ? null : (antigo ? antigo.baixa || null : null)});
    }
    await salvarReg(r);
    if (r.tipo !== 'dss' && r.planoId){ await paSyncReg(r).catch(() => {}); const c2 = cfg(); if (c2.planoPadrao !== r.planoId){ c2.planoPadrao = r.planoId; salvarCfg(c2).catch(() => {}); } }
    for (const ref of f.removidas) if (!paFotoUsada(ref)) apagarFoto(ref);
    f.fotos.forEach(p => p.url && URL.revokeObjectURL(p.url));
    F = null;
    toast(f.modo === 'editar' ? 'Registro atualizado.' : `${numero} salvo.`);
    abrirDetalhe(r.id);
  } catch (e){
    btn.disabled = false; btn.textContent = 'Tentar salvar de novo';
    toast('Não foi possível salvar' + (e && e.code ? ' (' + e.code + ')' : '') + '. Verifique a conexão e tente de novo.');
  }
}

const M = 14, PW = 210, PH = 297, CW = 182, BOT = PH - 18;
const TX = s => String(s ?? '').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/[–—−]/g,'-').replace(/[•·]/g,'-').replace(/…/g,'...').replace(/[^\x00-\xFF\n]/g,'');
const clara = (c, k = 0.88) => c.map(v => Math.round(v + (255 - v) * k));

async function cfgPDF(){
  const c = cfg();
  const out = Object.assign({}, c);
  const lg = logoAtual(c);
  try { const img = await carregarImg(lg); out.logoImg = {data:lg, w:img.naturalWidth, h:img.naturalHeight, fmt: lg.startsWith('data:image/png') ? 'PNG' : 'JPEG'}; } catch {}

    try { const img = await carregarImg(SELO_GRUPO); out.seloImg = {data:SELO_GRUPO, w:img.naturalWidth, h:img.naturalHeight}; } catch {}
  }

}
function faixa(doc, y, cor, haz){
  doc.setFillColor(...cor); doc.rect(M, y, CW, 2.4, 'F');
  if (haz){
    doc.setFillColor(27, 39, 51);
    for (let x = M - 4; x < M + CW + 2; x += 5.2) doc.lines([[2.6,0],[-2.4,2.4],[-2.6,0]], x + 2.4, y, [1,1], 'F', true);
    doc.setFillColor(255,255,255);
    doc.rect(0, y - 0.2, M, 2.8, 'F'); doc.rect(M + CW, y - 0.2, PW - M - CW, 2.8, 'F');
  }
}
function cabecalho(doc, cf, titulo, sub, placa, cor, haz, meta){
  const y = 10, H = 17;
  let x = M;
  if (cf.logoImg){
    const {data, w, h, fmt} = cf.logoImg;
    const s = Math.min(36 / w, H / h);
    try { doc.addImage(data, fmt, x, y + (H - h*s)/2, w*s, h*s, 'logo', 'FAST'); x += w*s; } catch {}
  } else {
    doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(...COR.brand);
    doc.text(TX(cf.empresa), x, y + 10); x += doc.getTextWidth(TX(cf.empresa));
  }
  if (cf.seloImg){
    x += 5;
    doc.setDrawColor(...COR.brand); doc.setLineWidth(0.3); doc.line(x, y + 1.5, x, y + H - 1.5);
    x += 5;
    const {data, w, h} = cf.seloImg;
    const s = Math.min(34 / w, 14 / h);
    try { doc.addImage(data, 'PNG', x, y + (H - h*s)/2, w*s, h*s, 'selo', 'FAST'); } catch {}

function grade(c, itens, cols = 3, x0 = M, w0 = CW){

    const sp = it.full ? cols : Math.min(it.span || 1, cols);
    if (soma + sp > cols){ rows.push(row); row = []; soma = 0; }
    row.push(Object.assign({}, it, {sp})); soma += sp;
    if (soma === cols){ rows.push(row); row = []; soma = 0; }
  }
  if (row.length) rows.push(row);
  const unit = w0 / cols;

async function imagemPDF(ref, wmm, hmm, modo){
  const img = await carregarImg(await fotoSrc(ref));
  const nw = img.naturalWidth, nh = img.naturalHeight;
  const k = 7;
  const cv = document.createElement('canvas');
  const x = cv.getContext('2d');
  if (modo === 'cover'){
    cv.width = Math.round(wmm * k); cv.height = Math.round(hmm * k);
    const r = Math.max(cv.width / nw, cv.height / nh);
    const sw = cv.width / r, sh = cv.height / r;
    x.drawImage(img, (nw - sw)/2, (nh - sh)/2, sw, sh, 0, 0, cv.width, cv.height);
    return {data:cv.toDataURL('image/jpeg', 0.86), w:wmm, h:hmm, dx:0, dy:0};
  }
  const s = Math.min(wmm / nw, hmm / nh);
  const w = nw * s, h = nh * s;
  cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  x.drawImage(img, 0, 0, cv.width, cv.height);
  return {data:cv.toDataURL('image/jpeg', 0.86), w, h, dx:(wmm - w)/2, dy:(hmm - h)/2};
}
function planoFotos(n, W, avail, largo){
  const gap = 3, capH = 8.6;
  const cands = [];
  for (let cols = 1; cols <= Math.min(n, 4); cols++){
    const rows = Math.ceil(n / cols);
    const cw = (W - gap * (cols - 1)) / cols;
    const teto = n === 1 ? cw * (largo ? 0.62 : 0.85) : cw;
    const h = Math.min(teto, (avail - rows * capH - (rows - 1) * gap) / rows);
    if (h <= 0) continue;
    cands.push({cols, rows, cw, h, gap, capH, area:n * cw * h, ok: n === 1 || cw / h <= 1.8});
  }
  const boas = cands.filter(k => k.ok);
  const lista = boas.length ? boas : cands;
  return lista.sort((a, b) => b.area - a.area)[0] || null;
}

const nomeArq = s => TX(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
async function salvarArquivo(nome, data){
  if (S.dl){
    try { await S.dl.save({filename:nome, data}); toast('Arquivo pronto.'); }
    catch (e){ if (e && e.code === 'declined') return; toast('Não foi possível salvar o arquivo' + (e && e.code ? ' (' + e.code + ')' : '') + '.'); }
    return;
  }
  const blob = data instanceof Blob ? data : new Blob([data]);
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
let gerando = false;
async function gerar(btn, fn, nome){
  if (gerando) return;
  if (!window.jspdf){ toast('O gerador de PDF não carregou. Verifique a internet e recarregue.'); return; }
  gerando = true;
  const txt = btn ? btn.innerHTML : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Gerando PDF…'; }
  try { const doc = await fn(); await salvarArquivo(nome, doc.output('blob')); }
  catch (e){ console.error(e); toast('Erro ao gerar o PDF.'); }
  finally { gerando = false; if (btn && btn.isConnected){ btn.disabled = false; btn.innerHTML = txt; } }
}

const PA_URL = location.origin + location.pathname;
const PA_PR = {
  alta:{nome:'Alta', cor:'var(--interd)', rgb:[198,47,40], ord:0},
  media:{nome:'Média', cor:'var(--notif)', rgb:[199,127,0], ord:1},
  baixa:{nome:'Baixa', cor:'var(--interv)', rgb:[31,111,178], ord:2},
};
const PA_ST = {
  nao_iniciada:{nome:'Não iniciada', cls:'s-nao', rgb:[110,122,132]},
  andamento:{nome:'Em andamento', cls:'s-and', rgb:[31,111,178]},
  concluida:{nome:'Concluída', cls:'s-ok', rgb:[46,139,87]},
};
const PA = {planos:[], acoes:[], okP:false, okA:false, sel:null, f:{q:'', pr:'todas', st:'abertas', imp:false, venc:false, semp:false}};
const paHashRaw = () => { let h; try { h = decodeURIComponent((location.hash || '').slice(1)).trim(); } catch { h = (location.hash || '').slice(1); } return h.replace(/\/(dashboard|painel)$/i, ''); };
const paHash = () => { const h = paHashRaw(); if (!h) return null; const p = PA.planos.find(x => x.link && x.link === h); if (p) return p.id; return h.indexOf('plano-') === 0 ? h.slice(6) : h; };
const paSlug = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
const PUB_URL = 'https://claude.ai/artifact/3WPXWn1UauuXnvFTGUYGVo';
const paLink = p => PA_URL + '#' + (p.link || 'plano-' + p.id);
const isDono = () => window.nuvem ? nuvem.logado() : (!S.user || S.user.isOwner());
const paTec = () => ((cfg().inspetores || [])[0] || {}).nome || 'Segurança do Trabalho';
const pNome = p => (p && typeof p === 'object') ? (p.nome || '') : (p || '');
const pEmp = p => (p && typeof p === 'object') ? (p.empresa || '') : '';
const pTxt = p => [pNome(p), pEmp(p)].filter(Boolean).join(' · ');
const paAberta = a => a.status !== 'concluida';
const paOrdena = (a, b) => (PA_PR[a.prioridade].ord - PA_PR[b.prioridade].ord) || ((b.impeditivo && paAberta(b) ? 1 : 0) - (a.impeditivo && paAberta(a) ? 1 : 0)) || ((a.ordem || 0) - (b.ordem || 0));
const paDoPlano = pid => PA.acoes.filter(a => a.plano === pid);
function paSit(a){
  if (a.status === 'concluida') return {k:'ok', t: a.conclusao && a.conclusao.data ? `Concluída em ${fmtData(a.conclusao.data)}` : 'Concluída'};
  if (!a.prazo) return {k:'semp', t:'Sem prazo definido'};
  const d = diffDias(a.prazo, hojeISO());
  if (d < 0) return {k:'venc', t:`Vencida há ${plural(-d,'dia')}`};
  if (d === 0) return {k:'perto', t:'Vence hoje'};
  if (d <= 3) return {k:'perto', t:`Vence em ${plural(d,'dia')}`};
  return {k:'prazo', t:`Prazo ${fmtData(a.prazo)}`};
}
function paStats(l){
  const tot = l.length, ok = l.filter(a => a.status === 'concluida').length, and = l.filter(a => a.status === 'andamento').length;
  const ab = l.filter(paAberta);
  return {tot, ok, and, nao:tot - ok - and, pct: tot ? Math.round(ok / tot * 100) : 0,
    imp: ab.filter(a => a.impeditivo).length, venc: ab.filter(a => paSit(a).k === 'venc').length,
    semp: ab.filter(a => !a.prazo).length, altaAb: ab.filter(a => a.prioridade === 'alta').length,
    semResp: ab.filter(a => !pNome(a.responsavel)).length};
}
function paFiltrar(l){
  const f = PA.f, q = f.q.trim().toLowerCase();
  return l.filter(a => {
    if (f.pr !== 'todas' && a.prioridade !== f.pr) return false;
    if (f.st === 'abertas' && !paAberta(a)) return false;
    if (['andamento','nao_iniciada','concluida'].includes(f.st) && a.status !== f.st) return false;
    if (f.imp && !(a.impeditivo && paAberta(a))) return false;
    if (f.venc && paSit(a).k !== 'venc') return false;
    if (f.semp && !(paAberta(a) && !a.prazo)) return false;
    if (q && ![a.codigo, a.acao, a.contexto, a.frente, pTxt(a.responsavel), pTxt(a.apoio), a.observacao, a.origem && a.origem.numero].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort(paOrdena);
}
const refKey = r => r ? (r.k + ':' + (r.id || (r.data ? r.data.length : ''))) : '';
function paFotoUsada(ref, excetoId){ const k = refKey(ref); return PA.acoes.some(a => a.id !== excetoId && [...(a.fotosAntes || []), ...(a.fotosDepois || [])].some(f => refKey(f.ref) === k)); }
function regFotoUsada(ref){ const k = refKey(ref); return S.reg.some(r => [...(r.fotos || []), ...((r.baixa && r.baixa.fotos) || []), ...((r.ppEquip || []).flatMap(e => e.fotos || []))].some(f => refKey(f.ref) === k)); }
function paProxCodigo(pid){ return 'A' + pad(Math.max(0, ...paDoPlano(pid).map(a => +String(a.codigo || '').replace(/\D/g, '') || 0)) + 1); }
const paProxOrdem = pid => Math.max(0, ...paDoPlano(pid).map(a => a.ordem || 0)) + 1;
async function paSalvar(a){ const b = clone(a); delete b.id; await S.db.doc('planoAcoes/' + a.id).set(b); }
function paPessoas(p){
  const m = new Map();
  (p && p.pessoas || []).forEach(x => x.nome && m.set(x.nome, x.empresa || ''));
  PA.acoes.forEach(a => [a.responsavel, a.apoio].forEach(x => { const n = pNome(x); if (n && !m.has(n)) m.set(n, pEmp(x)); }));
  (cfg().inspetores || []).forEach(i => i.nome && !m.has(i.nome) && m.set(i.nome, 'Concremat'));
  return [...m].map(([nome, empresa]) => ({nome, empresa})).sort((a, b) => a.nome.localeCompare(b.nome));
}
const paPadrao = () => { const c = cfg(); return (c.planoPadrao && PA.planos.some(p => p.id === c.planoPadrao)) ? c.planoPadrao : ((PA.planos[0] || {}).id || ''); };

async function paSyncReg(r){
  if (!S.db || !r || r.tipo === 'dss') return;
  const ex = PA.acoes.find(a => a.origem && a.origem.regId === r.id);
  const pid = r.resultado !== 'conforme' ? r.planoId : '';
  if (!pid) return;
  if (!PA.planos.some(p => p.id === pid)) return;
  const a = ex ? clone(ex) : {id:uid(), plano:pid, codigo:paProxCodigo(pid), ordem:paProxOrdem(pid), status:'nao_iniciada', observacao:'', apoio:{nome:'', empresa:''}, evidencia:'', conclusao:null, fotosDepois:[],
    prioridade: r.resultado === 'notificacao' ? 'media' : 'alta', impeditivo: r.resultado === 'interdicao', criadoEm:hojeISO(),
    historico:[{data:r.data, hora:r.hora, texto:`Gerada a partir da ${RES[r.resultado].nome.toLowerCase()} ${r.numero}`, tipo:'cad', por:paTec()}]};
  if (ex && ex.plano !== pid){ a.plano = pid; a.codigo = paProxCodigo(pid); a.ordem = paProxOrdem(pid); }
  a.origem = {regId:r.id, numero:r.numero, resultado:r.resultado};
  a.frente = CATS[r.categoria] ? CATS[r.categoria].nome : 'Inspeção';
  a.acao = (r.recomendacoes || r.motivo || tituloReg(r)).trim();
  a.contexto = `${r.numero} · ${tituloReg(r)}${r.local ? ' · ' + r.local : ''}\n${r.motivo || ''}`.trim();
  if (!ex || !pNome(ex.responsavel)) a.responsavel = {nome:(r.notificado && r.notificado.nome) || '', empresa:(r.notificado && r.notificado.empresa) || ''};
  a.prazo = r.prazo || a.prazo || '';
  const fontes = (r.fotos && r.fotos.length) ? r.fotos : (r.ppEquip || []).flatMap(e => e.fotos || []);
  a.fotosAntes = fontes.slice(0, 8).map(f => ({ref:f.ref, legenda:f.legenda || ''}));
  a.historico = a.historico || [];
  if (r.status === 'baixada' && r.baixa){
    if (a.status !== 'concluida') a.historico.push({data:r.baixa.data, hora:r.baixa.hora || '', texto:`Concluída pela baixa da ${r.numero}: ${r.baixa.obs}`, tipo:'conclusao', por:r.baixa.por || paTec()});
    a.status = 'concluida'; a.evidencia = r.baixa.obs || ''; a.conclusao = {data:r.baixa.data, por:r.baixa.por || paTec()};
    a.fotosDepois = (r.baixa.fotos || []).map(f => ({ref:f.ref, legenda:f.legenda || ''}));
  } else if (a.status === 'concluida'){
    a.status = 'andamento'; a.conclusao = null; a.evidencia = ''; a.fotosDepois = [];
    a.historico.push({data:hojeISO(), hora:agoraHM(), texto:`Reaberta junto com a ${r.numero}`, tipo:'reaberta', por:paTec()});
  }
  a.atualizadoEm = new Date().toISOString();
  await paSalvar(a);
}
async function paBaixaNoReg(a){
  if (!a.origem) return;
  const r = S.reg.find(x => x.id === a.origem.regId);
  if (!r || r.status === 'baixada') return;
  const novo = clone(r);
  novo.status = 'baixada';
  novo.baixa = {data:(a.conclusao && a.conclusao.data) || hojeISO(), hora:agoraHM(), obs:a.evidencia || 'Concluída pelo plano de ação', por:paTec(), fotos:(a.fotosDepois || []).map(f => ({ref:f.ref, legenda:f.legenda || ''}))};
  novo.atualizadoEm = new Date().toISOString();
  await salvarReg(novo);
}
async function paReabrirReg(a){
  if (!a.origem) return;
  const r = S.reg.find(x => x.id === a.origem.regId);
  if (!r || r.status !== 'baixada') return;
  const novo = clone(r); novo.status = 'aberta'; novo.baixa = null; novo.atualizadoEm = new Date().toISOString();
  await salvarReg(novo);
}

function paHero(p, l){
  const st = paStats(l);
  const ord = l.slice().sort(paOrdena);
  return `<header class="pa-hero"><canvas class="pa-topo" aria-hidden="true"></canvas><div class="pa-in">
    <div class="pa-brand"><img class="lg" src="${PA_LOGO_W}" alt="Concremat"><img class="sl" src="${PA_SELO_W}" alt="Uma empresa do grupo CCCC"><span class="pa-live"><i></i>Ao vivo</span></div>
    ${p.descricao ? `<p class="pa-eyebrow">${esc(p.descricao)}</p>` : ''}
    <h1>${esc(p.nome || 'Plano de ação')}</h1>
    <div class="pa-hgrid">
      <div><div class="pa-pct">${st.pct}<small>%</small></div><div class="pa-pctl">concluído: ${st.ok} de ${plural(st.tot,'ação','ações')}, ${st.and} em andamento</div></div>
      <div>
        <div class="pa-ribwrap"><div class="pa-ribbon" style="--n:${Math.max(1, ord.length)}">${ord.map(a => {
          const k = a.status === 'concluida' ? 'ok' : (a.status === 'andamento' ? 'and' : '');
          return `<button class="rseg ${k} ${a.impeditivo && paAberta(a) ? 'imp' : ''} ${paSit(a).k === 'venc' ? 'venc' : ''}" style="--pc:${PA_PR[a.prioridade].cor}" data-paopen="${a.id}" title="${esc(a.codigo + ' · ' + a.acao)}" aria-label="${esc(a.codigo + ': ' + a.acao)}"></button>`;
        }).join('')}</div></div>
        <div class="pa-rleg"><span><i style="background:#4ADE80"></i>Concluída</span><span><i style="background:repeating-linear-gradient(135deg,rgba(255,255,255,.6) 0 3px,rgba(255,255,255,.25) 3px 6px)"></i>Em andamento</span><span><i style="background:rgba(255,255,255,.18)"></i>Não iniciada</span><span><i style="background:repeating-linear-gradient(135deg,#14222E 0 3px,#F2B705 3px 6px)"></i>Impeditiva</span></div>
      </div>
    </div></div></header>`;
}
function paAlertas(l){
  const st = paStats(l), f = PA.f;
  return `<div class="pa-alerts">
    <button class="pa-al imp" style="--c:var(--interd)" data-paq="imp" aria-pressed="${f.imp}"><b>${st.imp}</b><span>Impeditivas em aberto</span></button>
    <button class="pa-al" style="--c:var(--interd)" data-paq="alta" aria-pressed="${f.pr === 'alta' && !f.imp && !f.venc && !f.semp}"><b>${st.altaAb}</b><span>Prioridade alta em aberto</span></button>
    <button class="pa-al" style="--c:${st.venc ? 'var(--interd)' : 'var(--ok)'}" data-paq="venc" aria-pressed="${f.venc}"><b>${st.venc}</b><span>Com prazo vencido</span></button>
    <button class="pa-al" style="--c:${st.semp ? 'var(--notif)' : 'var(--ok)'}" data-paq="semp" aria-pressed="${f.semp}"><b>${st.semp}</b><span>Sem prazo definido</span></button>
  </div>`;
}
function paBarra(l){
  const t = l.length || 1, ok = l.filter(a => a.status === 'concluida').length, an = l.filter(a => a.status === 'andamento').length;
  return `<div class="pa-track"><i style="width:${ok/t*100}%;background:var(--ok)"></i><i style="width:${an/t*100}%;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--interv) 70%,transparent) 0 5px,color-mix(in srgb,var(--interv) 35%,transparent) 5px 10px)"></i></div>`;
}
function paRotulo(g){
  const ok = g.filter(a => a.status === 'concluida').length, an = g.filter(a => a.status === 'andamento').length;
  return `<b style="color:var(--ink)">${ok}</b> de ${g.length} concluída${g.length === 1 ? '' : 's'}${an ? ` · ${an} em andamento` : ''}`;
}
function paPaineis(l){
  const fr = [...new Set(l.slice().sort((a,b) => (a.ordem||0) - (b.ordem||0)).map(a => a.frente).filter(Boolean))];
  const prox = l.filter(a => paAberta(a) && a.prazo).sort((a, b) => a.prazo.localeCompare(b.prazo)).slice(0, 6);
  const resp = {};
  l.filter(paAberta).forEach(a => { const n = pNome(a.responsavel) || 'A definir'; resp[n] = resp[n] || {n:0, emp:pEmp(a.responsavel)}; resp[n].n++; });
  const rl = Object.entries(resp).sort((a, b) => b[1].n - a[1].n).slice(0, 6);
  return `<div class="pa-cols">
    <section class="panel">
      <h2>Por prioridade</h2>
      <div class="pa-pbars">${Object.keys(PA_PR).map(k => { const g = l.filter(a => a.prioridade === k); return g.length ? `<div><div class="pa-ptop"><b style="color:${PA_PR[k].cor}">${PA_PR[k].nome}</b><span>${paRotulo(g)}</span></div>${paBarra(g)}</div>` : ''; }).join('')}</div>
      ${fr.length > 1 ? `<h2 style="margin-top:18px">Por frente</h2><div class="pa-pbars">${fr.map(x => { const g = l.filter(a => a.frente === x); return `<div><div class="pa-ptop"><b>${esc(x)}</b><span>${paRotulo(g)}</span></div>${paBarra(g)}</div>`; }).join('')}</div>` : ''}
      <div class="legend"><span><i style="background:var(--ok)"></i>Concluída</span><span><i style="background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--interv) 70%,transparent) 0 5px,color-mix(in srgb,var(--interv) 35%,transparent) 5px 10px)"></i>Em andamento</span><span><i style="background:var(--surface2);outline:1px solid var(--line)"></i>Não iniciada</span></div>
    </section>
    <section class="panel">
      <h2>Próximos prazos</h2>
      ${prox.length ? `<div>${prox.map(a => { const s = paSit(a), d = diffDias(a.prazo, hojeISO()); return `<button class="pa-pz" data-paopen="${a.id}">
        <span class="pa-pzd" style="color:${s.k === 'venc' ? 'var(--interd)' : s.k === 'perto' ? 'var(--notif)' : 'var(--ink)'}">${fmtCurta(a.prazo)}<small>${d < 0 ? 'vencida' : d === 0 ? 'hoje' : 'em ' + plural(d,'dia')}</small></span>
        <span><b style="color:${PA_PR[a.prioridade].cor}">${esc(a.codigo)}</b> ${esc(a.acao)}${pNome(a.responsavel) ? `<small class="muted" style="display:block">${esc(pTxt(a.responsavel))}</small>` : ''}</span></button>`; }).join('')}</div>`
      : `<p class="muted" style="margin:0;font-size:14px">Nenhuma ação aberta tem prazo definido.</p>`}
      <h2 style="margin-top:18px">Ações abertas por responsável</h2>
      ${rl.length ? `<div class="pa-resp">${rl.map(([n, x]) => `<div><span><b>${esc(n)}</b>${x.emp ? `<small>${esc(x.emp)}</small>` : ''}</span><em>${x.n}</em></div>`).join('')}</div>` : `<p class="muted" style="margin:0;font-size:14px">Nenhuma ação aberta.</p>`}
    </section>
  </div>`;
}
function paItem(a){
  const s = paSit(a), an = (a.fotosAntes || [])[0], de = (a.fotosDepois || [])[0];
  return `<button class="pa-item ${a.status === 'concluida' ? 'done' : ''}" style="--pc:${PA_PR[a.prioridade].cor}" data-paopen="${a.id}">
    <span class="pa-code">${esc(a.codigo)}</span>
    <span class="pa-txt"><strong>${esc(a.acao)}</strong>
      <span class="pa-meta"><span>${esc(a.frente || '')}</span>${pNome(a.responsavel) ? `<span>Resp. <b>${esc(pNome(a.responsavel))}</b>${pEmp(a.responsavel) ? ' · ' + esc(pEmp(a.responsavel)) : ''}</span>` : '<span>Responsável a definir</span>'}${pNome(a.apoio) ? `<span>Apoio <b>${esc(pNome(a.apoio))}</b></span>` : ''}${a.origem ? `<span>Origem <b>${esc(a.origem.numero)}</b></span>` : ''}</span>
      <span class="pa-tags"><span class="pill ${PA_ST[a.status].cls}">${PA_ST[a.status].nome}</span>${a.impeditivo && paAberta(a) ? '<span class="pill imp">Impeditiva</span>' : ''}${a.status !== 'concluida' ? `<span class="pill ${s.k}">${esc(s.t)}</span>` : `<span class="pill s-ok">${esc(s.t)}</span>`}</span>

    ${an || de ? `<span class="pa-thumbs">${an ? `<span>${imgRef(an.ref)}<small style="background:var(--interd)">Antes</small></span>` : ''}${de ? `<span>${imgRef(de.ref)}<small style="background:var(--ok)">Depois</small></span>` : ''}</span>` : ''}
  </button>`;
}
function paLista(l){
  const f = PA.f, r = paFiltrar(l);

  return `<section id="paAcoes" style="margin-top:22px">

      <div class="pa-chips">${[['abertas','Abertas'],['andamento','Em andamento'],['nao_iniciada','Não iniciadas'],['concluida','Concluídas'],['todas','Todas']].map(([v, t]) => `<button data-pafst="${v}" aria-pressed="${f.st === v}">${t}</button>`).join('')}</div>

    </div>
    ${grupos.length ? grupos.map(g => `<div class="pa-grp"><div class="pa-grph"><span style="background:${PA_PR[g.k].cor}"></span><h3>Prioridade ${PA_PR[g.k].nome.toLowerCase()}</h3><em>${g.l.length}</em></div><div class="list">${g.l.map(paItem).join('')}</div></div>`).join('')
      : `<div class="empty"><b>Nenhuma ação com esses filtros</b>Troque a situação para "Todas" ou limpe a busca.</div>`}
  </section>`;
}
function paTopo(root){
  $$('canvas.pa-topo', root).forEach(cv => {
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
    const x = cv.getContext('2d'); x.scale(dpr, dpr); x.strokeStyle = 'rgba(82,158,208,.33)'; x.lineWidth = 1;
    const W = r.width, H = r.height, cx = W * .82, cy = H * .35;
    for (let k = 1; k <= 22; k++){
      x.beginPath();
      for (let t = 0; t <= Math.PI * 2 + .05; t += .05){
        const rr = k * 26 + Math.sin(t * 3 + k * .7) * 9 + Math.cos(t * 5 - k) * 6;
        const px = cx + Math.cos(t) * rr * 1.35, py = cy + Math.sin(t) * rr * .8;
        t === 0 ? x.moveTo(px, py) : x.lineTo(px, py);
      }
      x.stroke();
    }
  });
}
function paManterFoco(fn){
  const q = document.activeElement && document.activeElement.id === 'paQ' ? $('#paQ').selectionStart : null;
  fn();

async function paSubir(lista){
  const out = [];
  for (const p of lista) out.push({ref: p.ref || await guardarFoto(p.file), legenda:(p.legenda || '').trim()});
  return out;
}
function paLimparFotos(refs, excetoId){ refs.forEach(ref => { if (!regFotoUsada(ref) && !paFotoUsada(ref, excetoId)) apagarFoto(ref); }); }
async function paSalvarForm(btn){
  const a = F.a;
  a.acao = (a.acao || '').trim(); a.frente = (a.frente || '').trim();
  if (!a.acao) return toast('Descreva o que precisa ser feito.');
  btn.disabled = true; btn.textContent = 'Salvando…';
  try {
    a.fotosAntes = await paSubir(F.fotosAntes);
    a.fotosDepois = await paSubir(F.fotosDepois);
    const ant = PA.acoes.find(x => x.id === a.id);
    a.historico = a.historico || [];
    if (F.novo) a.historico.push({data:hojeISO(), hora:agoraHM(), texto:'Ação cadastrada', tipo:'cad', por:paTec()});
    else {
      const m = [];
      if (pTxt(ant.responsavel) !== pTxt(a.responsavel)) m.push(`responsável: ${pTxt(a.responsavel) || 'a definir'}`);
      if (pTxt(ant.apoio) !== pTxt(a.apoio)) m.push(`apoio: ${pTxt(a.apoio) || 'nenhum'}`);
      if (ant.prazo !== a.prazo) m.push(`prazo: ${a.prazo ? fmtData(a.prazo) : 'sem prazo'}`);
      if (ant.status !== a.status) m.push(`situação: ${PA_ST[a.status].nome.toLowerCase()}`);
      if (ant.prioridade !== a.prioridade) m.push(`prioridade: ${PA_PR[a.prioridade].nome.toLowerCase()}`);
      if (!!ant.impeditivo !== !!a.impeditivo) m.push(a.impeditivo ? 'marcada como impeditiva' : 'deixou de ser impeditiva');
      if (a.fotosAntes.length + a.fotosDepois.length > (ant.fotosAntes || []).length + (ant.fotosDepois || []).length) m.push('fotos adicionadas');
      if (m.length) a.historico.push({data:hojeISO(), hora:agoraHM(), texto:'Atualizado: ' + m.join(', '), tipo:'edit', por:paTec()});
    }
    const eraConcl = ant && ant.status === 'concluida';
    if (a.status === 'concluida' && !a.conclusao) a.conclusao = {data:hojeISO(), por:paTec()};
    if (a.status !== 'concluida') a.conclusao = null;
    a.atualizadoEm = new Date().toISOString();
    await paSalvar(a);
    if (a.status === 'concluida' && !eraConcl) await paBaixaNoReg(a).catch(() => {});
    if (eraConcl && a.status !== 'concluida') await paReabrirReg(a).catch(() => {});
    paLimparFotos(F.removidas, a.id);
    const id = a.id, nv = F.novo; F = null;
    toast(nv ? `${a.codigo} cadastrada.` : `${a.codigo} salva.`);
    paDetalhe(id);
  } catch (e){ btn.disabled = false; btn.textContent = 'Tentar de novo'; toast('Não foi possível salvar' + (e && e.code ? ` (${e.code})` : '') + '.'); }
}
function paConcluir(a){

}
function paDesenharConcl(){
  const a = F.a;
  const c = `<div class="dhero" style="--c:${PA_PR[a.prioridade].cor}"><div class="stripe"></div><div class="in"><span class="pill">${esc(a.codigo)}</span><h3 style="font-family:Barlow,sans-serif;font-weight:600;font-size:18px;margin-top:8px">${esc(a.acao)}</h3></div></div>

      <label class="f">Evidência da adequação<textarea id="paEv" data-k="evid" placeholder="Ex.: leiras construídas com 1,5 m em volta das duas tendas">${esc(F.evid)}</textarea></label>
      <label class="f">Data da conclusão<input type="date" id="paDc" data-k="data" value="${esc(F.data)}"></label>
      ${a.origem ? `<p class="muted" style="margin:0;font-size:13px">A ${esc(a.origem.numero)} recebe a baixa junto, com estas fotos como evidência.</p>` : ''}
